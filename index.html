+1 link. When your turn begins, lose 1 credit.\nR1U1|R|PROGRAM|Icebreaker - AI|Warmind|6|3|0|0|0|2|BREAK:any 2 2;BOOST:1 1|Interface: 2 credits - break 2 subroutines on any ice. 1 credit: +1 strength.\nR1U2|R|PROGRAM|Icebreaker - Killer|Bayonet|3|3|0|0|0|1|BREAK:sentry 1 1;BOOST:2 1|Interface: 1 credit - break 1 Sentry subroutine. 2 credits: +1 strength.\nR1U3|R|PROGRAM|Virus|Scorch Worm|3|0|0|0|0|1|CLICK:olose 3|Click: The Corp loses 3 credits.\nR2U1|R|HARDWARE|Implant|Neural Armor|3|0|0|0|0|0|STATIC:hand 3|Your maximum hand size is +3.\nR2U2|R|HARDWARE|Console|Warbird Deck|5|0|0|0|0|0|STATIC:mu 2+link 2|+2 MU. +2 link.\nR3U1|R|RESOURCE|Connection|Arms Dealer|2|0|0|0|0|0|INSTALL:gain 5;TURN:lose 1|When you install this resource, gain 5 credits. When your turn begins, lose 1 credit.\nR3U2|R|RESOURCE|Job|Mercenary Contract|0|0|0|0|0|0|INSTALL:load 12;CLICK:take 4|When you install this resource, load 12 credits onto it. Click: Take 4 credits from it. When it is empty, trash it.\nR4U1|R|EVENT|Run|Final Assault|4|0|0|0|0|0|PLAY:run any;SUCCESS:olose 4+draw 2|Run any server. If successful, the Corp loses 4 credits and draw 2 cards.\nR4U2|R|EVENT|Mod|Battle Stims|1|0|0|0|0|0|PLAY:click 2+draw 1|Gain 2 clicks and draw 1 card.\n","deckCorp":"# GR_Deck_Corp - Corp STARTER deck (40 cards, 16 agenda points)\n# On first wear this becomes your card library. Escrow Vault, Bait Server and\n# Kinetic Response are not in the starter, and Paywall and Harrier only partly - draft them!\n# Format:  IDENTITY \u003cid>   then   \u003ccount> \u003cid>\n# Starter rebalance (16 Nov 2026): out 2 Deep Trace and 2 Leveraged Buyout; in 2 Paywall,\n# 1 Harrier and a 3rd Tracer Drone. More ice makes the Corp kinder to new players.\nIDENTITY C00\n3 C10\n1 C11\n2 C12\n3 C13\n3 C20\n3 C21\n3 C22\n2 C23\n1 C24\n3 C25\n3 C26\n3 C30\n2 C40\n3 C50\n2 C51\n3 C54\n","deckRunner":"# GR_Deck_Runner - Runner STARTER deck (40 cards)\n# On first wear this becomes your card library. Polyglot, Ledger Daemon and\n# Street Contract are not in the starter - draft them!\n# Format:  IDENTITY \u003cid>   then   \u003ccount> \u003cid>\nIDENTITY R00\n3 R10\n3 R11\n3 R12\n3 R20\n3 R21\n1 R22\n3 R30\n3 R32\n3 R40\n3 R41\n3 R42\n3 R43\n3 R44\n3 R45\n","rules":"GHOSTJACK - HOW TO PLAY\n\nYou play one side against the CPU. The game enforces the rules: lit cards in your hand can be used now, and a gold DECIDE panel opens whenever you must choose.\n\n\nPART 1 - THE GAME IN 60 SECONDS\n\nOne player is the CORP, a giant corporation.\nThe other is the RUNNER, a hacker.\n\nThe CORP hides secret projects called AGENDAS in\ncomputer SERVERS, guards them with security programs\ncalled ICE, and tries to finish (SCORE) them.\n\nThe RUNNER breaks into the Corp's servers (a RUN),\ngets past the ice with programs called ICEBREAKERS,\nand tries to STEAL those agendas.\n\nAgendas are worth points. The first player to\n7 AGENDA POINTS wins.\n\nThe Corp can also win by FLATLINING the Runner: doing\ndamage when the Runner has no cards left to lose.\nThe Runner also wins if the Corp runs out of cards.\n\nEach turn you spend CLICKS (actions) and CREDITS\n(money):\n  - Corp: 3 clicks a turn\n  - Runner: 4 clicks a turn\nBoth players start with 5 credits and 5 cards.\n\n\nPART 3 - WORDS YOU NEED TO KNOW\n\nCLICK ........ One action. You spend clicks to do things.\nCREDIT ....... Money (¢). Shown big at the top of the game.\nHAND ......... The cards you hold (secret).\n               The Corp's hand is HQ.\n               The Runner's hand is the GRIP.\nDECK ......... The Corp's deck is R&D.\n               The Runner's deck is the STACK.\nDISCARD ...... The Corp's discard pile is ARCHIVES.\n               The Runner's discard pile is the HEAP.\nSERVER ....... A place where Corp cards live.\n  Central servers: HQ, R&D and Archives (always there).\n  Remote servers: Server 1, Server 2... (the Corp makes\n  new ones when it installs cards).\nICE .......... Security cards in front of a server.\nROOT ......... The inside of a server, behind the ice:\n               agendas, assets and upgrades live here.\nINSTALL ...... Put a card into play.\nREZ .......... Turn a face-down Corp card face up by\n               paying its rez cost. Unrezzed cards do\n               nothing.\nADVANCE ...... Put an advancement token (+1) on a card.\n               Agendas need enough tokens to be scored.\nRUN .......... The Runner attacking a server.\nENCOUNTER .... Facing a rezzed piece of ice in a run.\nSUBROUTINE ... An effect on ice (\"End the run\", \"Do 2\n               net damage\"...). It fires unless broken.\nBREAK ........ Use an icebreaker to stop a subroutine.\nSTRENGTH ..... The number badge on ice and icebreakers.\nACCESS ....... Look at Corp cards after a successful run.\nSTEAL ........ Take an agenda you accessed (you score it).\nTRASH ........ Destroy a card (to Archives or the Heap).\nMU ........... Memory units. Programs use MU. The Runner\n               has 4 MU (some cards add more).\nLINK ......... The Runner's defence against traces.\nTAG .......... A mark that makes the Runner easy to hurt.\nTRACE ........ A credit-bidding duel (PART 9).\nFLATLINE ..... The Runner dies from damage: Corp wins.\nRIG .......... Everything the Runner has installed.\n\nCARD TYPES - CORP\n  AGENDA ..... Worth points. Install, advance, score.\n  ICE ........ Protects servers.\n  ASSET ...... A useful card in a remote server (money,\n               traps...). Works once rezzed.\n  UPGRADE .... Like an asset, but can go in ANY server,\n               including HQ, R&D and Archives.\n  OPERATION .. A one-shot effect, played from your hand.\n  IDENTITY ... Your corporation. Always in play.\n\nCARD TYPES - RUNNER\n  PROGRAM .... Software in your rig. Uses MU.\n               ICEBREAKERS are programs.\n  HARDWARE ... Gear in your rig.\n  RESOURCE ... Contacts, jobs and places in your rig.\n  EVENT ...... A one-shot effect, played from your hand.\n  IDENTITY ... Your hacker. Always in play.\n\n\nPART 4 - THE CORP'S TURN\n\nSTART OF TURN (automatic):\n  1. \"When your turn begins\" effects happen (for\n     example Ad Network gives you 1 credit).\n  2. You DRAW 1 card. This is mandatory. If R&D is\n     empty and you must draw, you LOSE.\n\nTHEN SPEND 3 CLICKS, in any order:\n\n  +1 CREDIT ............... 1 click: gain 1 credit.\n  DRAW .................... 1 click: draw 1 card.\n  INSTALL A CARD .......... 1 click (tap it in your hand).\n     - ICE: choose the server to protect. You pay 1\n       credit for each ice ALREADY protecting it (the\n       \"ice tax\"): the first ice is free, the second\n       costs 1, the third 2...\n     - AGENDA or ASSET: goes in a REMOTE server (an\n       existing one or \"New remote server\"). A remote\n       holds only ONE agenda or asset; installing a new\n       one there trashes the old one.\n     - UPGRADE: any server, including HQ, R&D, Archives.\n     Everything goes in FACE DOWN (unrezzed), and costs\n     no credits to install (except the ice tax).\n  PLAY AN OPERATION ....... 1 click + its cost.\n  ADVANCE A CARD .......... 1 click + 1 credit: one\n                            advancement token on an\n                            agenda (or a card that says\n                            it can be advanced).\n  USE A CARD ABILITY ...... 1 click (\"Click: ...\" cards,\n                            once rezzed).\n  TRASH A RESOURCE ........ 1 click + 2 credits: trash a\n                            Runner resource - ONLY while\n                            the Runner has a tag.\n\nFREE ACTIONS (no click):\n  REZ an asset or upgrade . Pay its rez cost, any time no\n                            run is happening, even on the\n                            Runner's turn.\n  SCORE an agenda ......... When it has as many tokens as\n                            its ADVANCE number, tap it and\n                            choose SCORE. Only on your own\n                            turn.\n\nREZZING ICE: never on your own turn. Ice is rezzed when\nthe Runner runs into it - a panel asks \"Rez it?\" right\nthen. That's the Corp's big bluff: the Runner never\nknows whether you can afford it.\n\nEND OF TURN:\n  Tap END TURN. If you hold more cards than your\n  maximum hand size (normally 5), a panel lets you\n  choose which to discard.\n\n\nPART 5 - THE RUNNER'S TURN\n\nSTART OF TURN (automatic):\n  \"When your turn begins\" effects happen (for example\n  Safehouse Stash gives you 2 credits). The Runner does\n  NOT draw a free card - drawing costs a click.\n\nTHEN SPEND 4 CLICKS, in any order:\n\n  +1 CREDIT ............... 1 click: gain 1 credit.\n  DRAW .................... 1 click: draw 1 card. (Empty\n                            stack? Nothing happens - you\n                            don't lose for that.)\n  INSTALL A CARD .......... 1 click + its cost. Programs,\n                            hardware and resources go in\n                            your rig. Programs need free\n                            MU: if you're full, trash one\n                            first (tap it > Manual fixes >\n                            Trash card).\n  PLAY AN EVENT ........... 1 click + its cost.\n  RUN A SERVER ............ 1 click (tap a server name or\n                            RUN). See PART 6.\n  CLEAR TAG ............... 1 click + 2 credits: remove\n                            one tag.\n  USE A CARD ABILITY ...... 1 click (\"Click: ...\" cards).\n\nSome events include a run (Wash Cycle: \"Run any server.\nIf successful, gain 5 credits\"). Playing the event is\nyour click - the run comes with it.\n\nEND OF TURN:\n  Tap END TURN and discard down to your maximum hand\n  size (normally 5, minus 1 for each brain damage).\n\n\nPART 6 - RUNS, STEP BY STEP\n\nSTEP 1 - START\n  The Runner picks a server and spends a click (or\n  plays a run event). If the Corp has BAD PUBLICITY,\n  the Runner gains 1 credit per point right now.\n\nSTEP 2 - APPROACH THE ICE (outermost first)\n  Ice is listed from the TOP of the server column down:\n  the top one is hit first, the one nearest the server\n  last. For each piece of ice:\n    a) UNREZZED? The Corp gets a panel: \"Rez it?\"\n       - Not rezzed: the Runner slips past for free.\n       - Rezzed: the Runner ENCOUNTERS it (step 3).\n       (If the Corp can't afford it, no panel appears\n       and the Runner passes.)\n    b) Already REZZED: the Runner encounters it.\n\nSTEP 3 - ENCOUNTER\n  The Runner gets a panel with the ice's subroutines:\n    - BOOST a breaker (pay to raise its strength)\n    - BREAK with a breaker (pay to stop a subroutine)\n    - DONE - LET SUBS FIRE\n  Break all, some or none. When you choose DONE, every\n  unbroken subroutine happens, top to bottom. \"End the\n  run\" ends the run (unsuccessful).\n\nSTEP 4 - CONTINUE OR JACK OUT\n  After each piece of ice the Runner chooses CONTINUE\n  (on to the next ice or the server) or JACK OUT (stop\n  safely - the run is unsuccessful).\n\nSTEP 5 - SUCCESS!\n  Past all the ice, the run is SUCCESSFUL. \"If\n  successful\" bonuses from run events happen now.\n\nSTEP 6 - ACCESS\n  The Runner looks at Corp cards in that server\n  (PART 8). Then the run ends.\n\nThe red RUN banner on both HUDs shows where the run is:\nwhich server, which ice, and who decides next.\n\n\nPART 7 - ICE AND ICEBREAKERS\n\nThree kinds of ice, each with its own colour on the\nHUD, each beaten by the breaker of the same colour:\n\n  AMBER - BARRIER ..... broken by FRACTERS\n          (stops you cold: \"End the run\")\n  BLUE  - CODE GATE ... broken by DECODERS\n          (tricks: lose credits, lose clicks)\n  RED   - SENTRY ...... broken by KILLERS\n          (attacks: damage, trash programs, traces)\n  AI breakers (white) break ANY ice.\n\nSome ice is two kinds at once, like Razor Lattice\n(Barrier AND Sentry) - either breaker type works.\n\nSTRENGTH: a breaker only breaks ice whose strength is\nEQUAL TO OR LOWER than its own.\n\nBOOSTING: most breakers pay for strength (Pickaxe:\n\"1 credit: +1 strength\"). A boost lasts for the current\nencounter only.\n\nBREAKING: each breaker has a price (Pickaxe: \"1 credit -\nbreak 1 Barrier subroutine\"). Some break several at\nonce (Sledge: \"2 credits - break up to 2\"). Big ice\nneeds big breakers: Black Glacier is strength 8 with\nthree \"End the run\" subroutines.\n\nNo matching breaker, or not enough money? Choose DONE\nand take the hits. Sometimes that's fine (\"lose 2\ncredits\"); sometimes it ends your run.\n\nUnrezzed ice shows face down to the Runner. It might be\ncheap Frostline or deadly Harrier - you won't know until\nthe Corp rezzes it.\n\n\nPART 8 - ACCESSING CARDS\n\nWhat you access depends on the server:\n\n  HQ ........ 1 RANDOM card from the Corp's hand.\n  R&D ....... The TOP card of the Corp's deck.\n  ARCHIVES .. EVERY card in the discard pile (face-down\n              ones are turned face up first).\n  REMOTE .... Every card in that server's root.\n  ...plus every UPGRADE in the server you ran.\n\nSome cards access more: Packet Sniffer and the Sable\nidentity (+1 card on R&D), Deep Crawler and the Cipher\nidentity (+1 card on HQ).\n\nWhat happens to accessed cards:\n  AGENDA ....... STOLEN! It goes to your score area with\n                 its points. Automatic.\n  ASSET or\n  UPGRADE ...... You may pay its TRASH COST to trash it\n                 (a panel asks). Can't afford it or say\n                 no? It stays.\n  ANYTHING ELSE  You see it, then it stays where it was.\n  Archives cards are already trashed - you can steal\n  agendas there, but there's nothing to trash.\n\nTRAPS! Some cards hurt you WHEN ACCESSED, wherever they\nare:\n  Honeypot Node ..... 3 net damage\n  Bait Server ....... 2 net damage per advancement token\n  Tripwire Array .... 2 net damage\n  Neurotoxin Cache .. 1 BRAIN damage\n  Signal Scrambler .. 1 tag\n  Audit Log ......... 1 tag, and you lose 1 credit\n  Watchtower Relay .. Trace 5 for 2 tags\n  Vault Concierge ... you lose 3 credits\n  Lag Spike Relay ... you lose 2 clicks\n  Cryo Bay .......... you lose 1 click and 1 credit\n  Synaptic Lock ..... you lose 1 click, 1 net damage\nSome agendas bite when stolen:\n  Deadman Clause ........ 2 net damage\n  Neural Override Trial . 1 brain damage\n  Kill Chain Doctrine ... 2 tags\n\n\nPART 9 - TRACES, TAGS, DAMAGE, BAD PUBLICITY\n\nTRACES (a bidding war)\n  \"Trace X - if successful, \u003ceffect>\":\n  1. The Corp starts at strength X and may spend\n     credits: +1 trace strength each.\n  2. The Runner sees the result and may spend credits:\n     +1 LINK each (on top of the base link from your\n     identity and cards - Vex has 1, Signal Booster\n     adds 1).\n  3. Trace strength HIGHER than link: the trace\n     succeeds. TIES GO TO THE RUNNER.\n\nTAGS\n  While you have a tag, the Corp can:\n    - trash your resources (1 click + 2 credits each)\n    - play \"only if the Runner is tagged\" cards:\n      Kinetic Response (4 meat damage!), Wetwork\n      Contract (3 meat), Mind Wipe (2 BRAIN damage),\n      Neural Spike, Signal Purge (trash a program).\n  Tags stay until removed: CLEAR TAG (1 click + 2\n  credits) or cards like Scrub Records, Ghost Protocol,\n  Spoofed Credentials and Identity Broker.\n\nDAMAGE\n  NET and MEAT damage: one RANDOM card from the\n  Runner's hand is trashed per point.\n  BRAIN damage: the same, AND your maximum hand size\n  drops by 1 for good, per point.\n  Damage with an EMPTY hand FLATLINES the Runner: the\n  Corp wins. Keep cards in hand when you run into\n  sentries!\n  Damage also comes without runs: scoring Private Army\n  Charter does 2 meat damage, and Incident Response\n  Team can trace for 2 meat. Brain damage comes from\n  Synapse Burn, Mind Wipe, Neurotoxin Cache, Neural\n  Override Trial and Neural Spike. A bigger hand (Rook,\n  Patchwork, Shock Dampener, Street Surgeon...) is your\n  best defence.\n\nBAD PUBLICITY\n  Some strong Corp cards give bad publicity: Leveraged\n  Buyout, Off-Book Contract, Private Army Charter, Cash\n  Wall, Black Market Stall, Slush Account, Wetwork\n  Contract. Each point gives the Runner 1 free credit\n  at the start of EVERY run, for the rest of the game.\n\n\nPART 10 - WINNING, REWARDS AND PLAYING FOR CARDS\n\nThe game ends the moment ANY of these happens:\n\nCORP WINS if:\n  - The Corp has scored 7 or more agenda points.\n  - The Runner is FLATLINED.\n  - The Runner's maximum hand size is below zero at the\n    end of their turn (too much brain damage).\n\nRUNNER WINS if:\n  - The Runner has stolen 7 or more agenda points.\n  - The Corp must draw from an empty R&D.\n\nThe score bars at the top of the game show both players'\npoints. The banner says YOU WIN or YOU LOSE, and why.\n\n\nPART 11 - THE LITTLE RULES\n\nTURNS AND CLICKS\n - Click actions only on your own turn, and not while a\n   run or a panel is in progress.\n - Unused clicks are lost when you end your turn (END\n   TURN asks first if you have clicks left).\n - Extra clicks: this turn (Overtime Shift, Adrenal\n   Surge, Heat Sink, Quick Patch) or every turn (Orbital\n   Command Deck, Zero-G Rig, Glacier Systems). Scoring\n   Orbital Mirror Array gives 2 right away, Ice Age\n   Initiative 1.\n - \"Runner loses a click\" only matters on the Runner's\n   own turn.\n\nMONEY\n - Credits never go below 0.\n - Some cards hold credits ($ badge) - Escrow Vault,\n   Safehouse Stash, Smuggler's Network. Take them as the\n   card says; an empty one trashes itself.\n - The Runner can drain the Corp: Siphon Script, Payload\n   Worm, Zombie Net, Smash and Dash, Zero-Day Exploit.\n   A broke Corp can't rez its ice!\n - Cards that cost money every turn (Loan Shark, Glacier\n   Systems) just drop you to 0 if you can't pay.\n\nINSTALLING\n - Corp cards are installed face down; the Runner sees\n   them only when rezzed.\n - Replacing the agenda or asset in a remote trashes the\n   old one (face down to Archives).\n - Runner programs can't use more MU than you have (4,\n   plus Memory Shard, Coolant Loop, Cache Drive, Burner\n   Deck, Gold-Plated Deck, Juno, Rime; Patchwork has 1\n   LESS). Hardware and resources use no MU.\n\nAGENDAS\n - You can install and advance an agenda in the same\n   turn. Advancing costs 1 click + 1 credit each time.\n - Scoring is free, on your own turn only.\n - Over-advancing is allowed but wasted.\n\nRUNS\n - Empty remote servers disappear, so they can't be run.\n - HQ, R&D and Archives can always be run, even with no\n   ice.\n - Ice is rezzed only as the Runner approaches it.\n   Assets and upgrades can be rezzed any time outside a\n   run. Rezzed ice stays rezzed.\n - You can't jack out before the first ice.\n - Breakers that break several subroutines break the\n   one you pick and the next unbroken ones after it.\n\nHAND SIZE\n - 5, changed by cards (Meridian Systems +1, Shock\n   Dampener +2, Halcyon Bank -1...) and brain damage.\n - You discard down only at the END of your own turn.\n\nDECKS\n - The Corp LOSES when it must draw from an empty R&D.\n   The Runner just can't draw.\n - Decks are shuffled at the start of the game.\n\nTRACES\n - Each side can spend up to 10 credits on a trace.\n - The Runner always sees the Corp's final strength\n   before choosing.\n\nMANUAL FIXES\n - If something unusual happens: MENU > Fix a problem >\n   Manual fixes (credits, clicks, tags, bad publicity,\n   brain damage, draw, shuffle, end the run), or tap a\n   card > Manual fixes (tokens, credits on it, rez,\n   trash). Every fix shows in the game log for both\n   players - play fair!\n\n\nPART 12 - EXAMPLES OF PLAY\n\nExamples 1-6, 9 and 10 use starter-deck cards. Kinetic\nResponse and Bait Server (7 and 8) come from boosters.\n\n-----------------------------------------------------\nEXAMPLE 1 - A CORP'S FIRST TURN\n-----------------------------------------------------\nThe Corp (Meridian Systems) has 5 credits and draws\nautomatically. Hand:\n  Neural Mesh Initiative (agenda, advance 3, 2 points)\n  Bulkhead (Barrier ice, rez 3, strength 3)\n  Frostline (Barrier ice, rez 1, strength 1)\n  Ad Network (asset, rez 2)\n  Liquidity Event (operation, cost 5: gain 9 credits)\n  Quarterly Briefing (operation)\n\nClick 1: Install Neural Mesh Initiative in a NEW remote\n         server - it becomes Server 1.\nClick 2: Install Bulkhead protecting Server 1 (free:\n         first ice there).\nClick 3: Install Frostline protecting HQ (also free).\n\n5 credits left: enough to rez Bulkhead if the Runner\ncomes knocking. The Runner sees only face-down cards.\nAgenda or trap? Cheap wall or something nasty?\n\n-----------------------------------------------------\nEXAMPLE 2 - THE RUNNER'S FIRST TURN\n-----------------------------------------------------\nThe Runner (Vex, 1 link) has 5 credits. Hand:\n  Pickaxe (Fracter, cost 3, strength 2, 1 MU)\n  Safehouse Stash (resource, cost 3)\n  Hot Streak (event, cost 5: gain 9 credits)\n  Stim Patch, Quick Score\n\nClick 1: Quick Score: gain 3 credits (5 -> 8).\nClick 2: Install Pickaxe (8 -> 5).\nClick 3: Install Safehouse Stash (5 -> 2). It loads 8\n         credits and pays 2 at the start of each turn.\nClick 4: Run HQ. The Corp doesn't rez Frostline (saving\n         money), the run succeeds, and the Runner sees\n         1 random card from HQ: Liquidity Event.\n\n-----------------------------------------------------\nEXAMPLE 3 - BREAKING ICE AND STEALING AN AGENDA\n-----------------------------------------------------\nA few turns later the Runner has 7 credits and Pickaxe\n(strength 2). Server 1 has one face-down ice.\n\nClick 1: Run Server 1.\n  - The Corp pays 3 and rezzes BULKHEAD (Barrier,\n    strength 3, subroutine: End the run).\n  - Pickaxe (2) is too weak, so the panel offers \"Boost\n    Pickaxe 1c\". Boost: strength 3 (7 -> 6 credits).\n  - \"Break: Pickaxe\" appears. Break End the run for 1\n    credit (6 -> 5).\n  - DONE: nothing left to fire. CONTINUE: no more ice.\n  - Access: Neural Mesh Initiative! STOLEN: 2 points.\n\nNext time Bulkhead is already rezzed - but Pickaxe still\nneeds its boost, because boosts last one encounter.\n\n-----------------------------------------------------\nEXAMPLE 4 - SCORING AN AGENDA\n-----------------------------------------------------\nCorp turn, 9 credits. Server 2 holds Sentinel Charter\n(advance 5, 3 points) with 3 tokens, behind two rezzed\nice.\n\nClick 1: Advance (4 tokens, 8 credits).\nClick 2: Advance (5 tokens, 7 credits).\nFree:    Tap it > SCORE IT! 3 points.\nClick 3: +1 credit.\n\nAdvancing over several turns is risky - the Runner sees\nthe tokens piling up.\n\n-----------------------------------------------------\nEXAMPLE 5 - A TRACE\n-----------------------------------------------------\nThe Runner hits Tracer Drone (Sentry):\n  Sub 1: Trace 3 - if successful, give the Runner 1 tag.\n  Sub 2: Trace 2 - if successful, end the run.\nNo killer, so DONE.\n\nSub 1: the Corp spends 2: strength 5. The Runner (Vex,\nlink 1, 6 credits) spends 4: link 5. A tie - the trace\nFAILS. Sub 2: the Corp spends its last 2: strength 4.\nThe Runner has 2 left: link 3. 4 beats 3: the run ENDS.\n\nTraces drain both sides - watch the credits!\n\n-----------------------------------------------------\nEXAMPLE 6 - FLATLINED!\n-----------------------------------------------------\nThe Runner holds 1 card and runs R&D. The Corp rezzes\nSynapse Lash (Sentry: Do 1 net damage, twice). No\nkiller:\n  - Sub 1 trashes the Runner's last card.\n  - Sub 2 hits an EMPTY hand: FLATLINED. CORP WINS!\nLesson: keep cards in hand before running unknown ice.\n\n-----------------------------------------------------\nEXAMPLE 7 - TAGGED AND PUNISHED\n-----------------------------------------------------\nThe Runner ends the turn with 1 tag. The Corp plays\nKinetic Response (only if tagged): 4 MEAT damage. The\nRunner had 3 cards: FLATLINED.\nOr, gentler: trash the Runner's Safehouse Stash (1 click\n+ 2 credits). Lesson: clearing a tag is usually worth it.\n\n-----------------------------------------------------\nEXAMPLE 8 - AN AMBUSH\n-----------------------------------------------------\nThe Corp installs Bait Server in a new remote and\nadvances it twice. It looks EXACTLY like an agenda. The\nRunner breaks in and accesses it: 2 net damage per\ntoken = 4. Ouch.\nLesson: advancement tokens are a promise, not proof.\n\n-----------------------------------------------------\nEXAMPLE 9 - THE ICE TAX\n-----------------------------------------------------\nHQ has 2 ice. A 3rd costs 2 credits plus the click; a\n4th would cost 3. Spread ice out early.\n\n-----------------------------------------------------\nEXAMPLE 10 - AN ARCHIVES RUN\n-----------------------------------------------------\nThe Corp discarded Leveraged Buyout (an agenda) at the\nend of a turn - face down into Archives. The Runner\nruns Archives (no ice!), everything flips face up, and\nthe Runner steals it: +1 point.\nLesson for the Corp: don't discard agendas into an\nunprotected Archives.\n\n\nPART 15 - STRATEGY TIPS\n\nCORP\n - Money first: Ad Network and Liquidity Event pay for\n   everything else.\n - Protect HQ and R&D early, even with cheap ice - the\n   Runner can steal from your hand and deck too.\n - Never leave an agenda alone in an unprotected remote.\n - Bluff! Install assets and ambushes in remotes and\n   advance them like agendas.\n - Keep credits to rez your ice. Unrezzed ice with no\n   money behind it is just a speed bump.\n - Runner tagged and low on cards? Look for damage\n   (Kinetic Response, Wetwork Contract, Mind Wipe).\n - Watch your bad publicity - a free credit for the\n   Runner on every run.\n - Defending a slice? Ice HQ and R&D first and keep\n   credits to rez - Archives doesn't count.\n\nRUNNER\n - Get a breaker of each colour: amber (Fracter), blue\n   (Decoder), red (Killer) - or an AI breaker.\n - Build your economy early (Safehouse Stash, Hot\n   Streak, Quick Score).\n - Run early, while the Corp is poor and its ice is\n   unrezzed.\n - R&D runs find agendas before the Corp draws them;\n   HQ runs steal the ones it holds.\n - Keep 2-3 cards in hand when running unknown ice.\n - Clear tags before ending your turn when you can.\n - Can the Corp afford to rez that ice? If not, run\n   now. Draining its money (Payload Worm, Zero-Day\n   Exploit) sets that up.\n - Facing a damage deck? Pack extra hand size.\n\nHave fun, and see you in the Grid.\n\n\nCREDITS\n\nSystem voice: \"DROID - Video Game Announcer\" by VoiceBosch (SoundBiter SFX library), CC BY-SA 4.0, https://creativecommons.org/licenses/by-sa/4.0/ - trimmed, filtered and level-matched for Ghostjack. Source: opengameart.org/node/162844\n\nSound effects and announcer lines: Kenney (kenney.nl) - Digital Audio, Interface Sounds, Sci-fi Sounds and Voiceover packs, CC0.\n\nCard art, game design and rules text: original to Ghostjack.","changelog":"# Ghostjack changelog, shown in the app under \"What's new\". Newest first.\n# \"== \u003cdate> | \u003ctitle>\" starts an update; each \"- \" line under it is one change, written for players.\n# Keep the title of the newest update unique: the app uses it to know whether a player has seen it.\n\n== 20 Nov 2026 | New title on every card\n- The GHOSTJACK name at the top of every card is now drawn as glowing circuit traces over a blue-to-red light, instead of white letters on black.\n- When you open a card, a blue and red strobe scrolls across the name (it stays still with Animations off or Battery saver on).\n\n== 20 Nov 2026 | Full-size pictures on 72 cards\n- 72 cards whose new art only filled the middle of the picture now stretch it to fill the whole frame.\n\n== 20 Nov 2026 | Browse and track cards\n- In the Library, swipe left or right on a card (or use the arrows) to browse through the list you're looking at.\n- Cards you don't own are flagged NOT OWNED. Tap ☆ Track this card to keep an eye on one.\n- The shop marks packs that can contain your tracked cards in gold, and a pack shows ★ FOUND when you pull one.\n- The Library's ★ Tracked filter shows just the cards you're tracking.\n\n== 19 Nov 2026 | All-new card art and two Super Rare identities\n- Every card has brand-new artwork, in both the Chrome Noir and Amber Terminal looks.\n- New rarity: Super Rare, marked with a shimmering gold diamond. About 1 Core pack in 50 has one, or buy it for 30 Chips.\n- Two Super Rare Runner identities join the Core set: B4dg3r (+2 link, +2 MU, an extra card from HQ and 1 credit each turn) and Bardus of the Ashlands (an extra click every turn, +2 hand size, and the Corp loses 1 credit each turn).\n\n== 19 Nov 2026 | Cleaner game log and ability buttons\n- Every card was tested: all 375 do what their text says.\n- The log now reads properly: \"1 point\" instead of \"1 pts\", \"1 tag\" instead of \"1 tag(s)\", \"draws 2 cards\" instead of \"draws 2\", and so on.\n- A Runner card's ability button no longer says \"Corp draws 2\" (Back-Alley Clinic and others): it now says what the card does for you, like \"Draw 2 cards\".\n- Unbroken subroutines are described in words (\"Trace 3: if successful, give the Runner 1 tag\") instead of game codes, in the log and when you break them.\n\n== 17 Nov 2026 | Settings, tappable log and music-friendly sound (2)\n- Tap a card name in the game log to read the card.\n- Ghostjack's sounds no longer pause or mute your music or podcast: they play alongside it.\n- Look & sound is now Settings: a big button on the home screen, and a ⚙ button at the top of every other screen (and in games).\n- A successful run that finds nothing to steal or trash now shows \"Nothing found\" for a moment.\n- If there was something to trash but you couldn't afford it, it says \"Not enough credits to trash asset\" instead.\n\n== 16 Nov 2026 | Slice loot survives dropped connections\n- If the connection drops after a slice, the card the slicer picked still reaches the defender's phone, even if either player closes Ghostjack.\n- Defenders can leave while the slicer is still choosing: the card they pick is taken when it arrives.\n- A slicer who closes Ghostjack before choosing gets a random card from the list next time they open it.\n\n== 16 Nov 2026 | Slicing steals for real\n- Win a slice and you steal one card of your choice from the other player's whole library (anything but an identity). It really leaves their collection now.\n- Rares still have a 50/50 chance to slip away: +2 Chips instead, and they keep the card.\n- Revenge pays more: beat the player who Sliced you for +6 Chips.\n\n== 16 Nov 2026 | Reports, chat filter and your own background\n- Advance & score: when you have the clicks and credits to finish an agenda this turn, tap its card and choose Advance & score to do it in one go.\n- Advancing an agenda that's already ready to score now asks first, since extra tokens do nothing for it.\n- Chat filter: racial, homophobic and transphobic slurs are blocked in chat, messages and names, and hidden if someone gets one through. Swearing is fine.\n- Report a player: tap their name (or Report in a game's chat) and say what happened. The player isn't told who reported them.\n- Your own background: Look & sound > Use my own picture. It stays on your phone and is never uploaded.\n- Look & sound now shows your player id at the bottom.\n\n== 16 Nov 2026 | Social panel and public chat\n- New 👥 button at the top of every game, including games against the CPU. It opens a social panel without leaving your game.\n- Chat: a public chat room with everyone who's online.\n- Online: everyone who's on right now. Friends: your friends, friend requests, trades, and anyone you've blocked.\n- Tap any player's name to add them as a friend, message them, offer a trade, slice them (if their slicing is on), or block or unblock them. Slicing from a CPU game saves that game so you can resume it.\n- Fixed: late in a game, the CPU Runner could stop breaking ice it had broken many times before and run into it over and over.\n\n== 16 Nov 2026 | Lighter on the network\n- Ghostjack now checks the network far less often when nothing is happening, which saves data and battery and leaves room for more players. Messages, invites, friend requests and trades still arrive within about 20 seconds on the Jack In screen, and within about 40 seconds elsewhere.\n- The Players and Friends lists refresh once a minute while you're looking at them.\n\n== 16 Nov 2026 | Smarter CPU Runner\n- Fixed: the CPU Runner kept running the same remote server every turn, even after it had already seen what was inside and couldn't do anything with it. It now remembers what it found. On Easy it leaves a card it has seen alone. On Hard it only comes back to trash it.\n- To keep Easy feeling easy, the Easy Runner never pays to trash your cards and takes simpler moves more often.\n\n== 16 Nov 2026 | Battery saver\n- New in Look & sound: Battery saver. It turns off the moving background effects and checks for messages less often. Set it to Auto (the default) to switch on by itself when your battery drops below 20% and you're not charging. On iPhone, turn it on yourself.\n- Keep screen on now has three choices: Off, During games (the new default) and Always. Menus now let your screen dim normally.\n\n== 16 Nov 2026 | IP addresses hidden\n- Open games and slices now connect through the Ghostjack relay, so players you don't know never see your IP address. A 🔒 next to their name in a game means the connection is private.\n- Games by room code or friend invite still connect directly. To hide your address in those too, go to Jack In > Games > Hide my IP address and choose \"from everyone\".\n\n== 16 Nov 2026 | Steadier panels and a back button\n- Fixed: the message window and other panels flickered while they were open.\n- Changing your name now asks you to confirm. Type it, then tap Save.\n- On the web and iPhone, your browser's back gesture now goes back inside Ghostjack instead of leaving it. There's also a back button at the top of the game screen.\n- Fixed: if the other player disconnected right after you won a slice, your loot was picked at random. Now you keep all the time you need to choose it.\n\n== 16 Nov 2026 | Reconnect and screen awake\n- Lost connection in an online game? It's paused while both phones try to reconnect for up to 2 minutes, and nothing is lost. Tap Reconnect now to try again straight away, or End game to stop. Ending it counts as no result.\n- The screen now stays on while Ghostjack is open. You can turn this off in Look & sound > Keep screen on.\n\n== 16 Nov 2026 | Finding players fixed\n- Fixed: Slice Targets and Open games could stay empty even when other players were listed. Both lists now come from the Ghostjack network, the same one as the Players tab.\n- When you close Ghostjack, you leave the lists right away. If you're Wanted, you show up under Most Wanted.\n\n== 16 Nov 2026 | Slicer attack\n- When someone slices you while Ghostjack is open, you get a SLICER ATTACK alarm: a screen wipe, a skull and crossbones, a siren and a flashing screen with \"(name) is slicing you\", then the panel to defend. Tap to skip it. With Animations off, it's a steady red alert with no flashing.\n- New setting in Look & sound: CPU moves. Choose Slow, Normal, Fast or Instant.\n- Your friends list and the Players tab now show a SLICED tag on anyone who's been sliced in the last 2 hours.\n\n== 16 Nov 2026 | Trading, Chips and Slicing\n- Trade cards with your friends: tap ⇄ next to a friend, pick the cards you give and the ones you want from their collection, and send the offer.\n- Your offered cards are set aside until your friend answers. Cancel any time before then to get them back. Trades complete even if one of you is offline.\n- Win points are now called Chips.\n- Invasions are now called Slicing. Lose one and someone has Sliced you.\n\n== 16 Nov 2026 | Jack in: friends and messages\n- Play a friend is now JACK IN, with tabs for Friends, Players, Games and Slicing.\n- Friends: share your 6-letter friend code, add other players' codes, accept friend requests, and see who's online and what they're doing.\n- Send messages to your friends, even when they're offline. They'll get them next time they open Ghostjack.\n- Invite a friend straight into a game. They get a pop-up to join.\n- Players: see who's online right now and send them a friend request. You can hide yourself from this list.\n- Notifications on your phone for messages, invites, friend requests and slices while Ghostjack is open or in the background.\n- You can add the other player as a friend at the end of an online game.\n\n== 16 Nov 2026 | The Wanted board\n- Wanted players can now be sliced while they're offline. Find them under Jack In > Slicing > Most Wanted.\n- Raiding an offline Wanted player is a fair fight against the CPU, which defends with their own Corp deck. Beat it to take their hot card.\n- When you come back online, Ghostjack tells you if someone sliced you while you were away.\n- Only the first slicer to win gets the card.\n\n== 16 Nov 2026 | Slicing\n- Slice other players: Jack In > Slicing. Turn them on to slice, and be sliced while Ghostjack is open.\n- A slice is one quick round. The defender plays the Corp and the slicer plays the Runner. Break into HQ, R&D or a remote server to win.\n- Win a slice and you take a copy of one of their cards. It's hot: you're Wanted for 2 hours, and anyone who slices you and wins takes it from you.\n- If you don't answer a slice while you're Wanted, the CPU defends for you.\n- Lose a slice and you're Sliced: you can see who did it, and beating them in a slice pays a revenge bonus.\n\n== 16 Nov 2026 | Private Contracts\n- New on the home screen: Private Contracts. Every day there are 3 Runner and 3 Corp contracts to finish for chips. Get paid for all six to earn a bonus.\n- Contracts count games against the CPU and against other players. They change at midnight, and pay you haven't claimed by then is lost.\n- Factions are gone for now. Identities no longer show a faction.\n- In online games, the second player's game log no longer stops updating in very long games.\n\n== 16 Nov 2026 | Runner log button\n- The Runner now has a LOG button next to END TURN, like the Corp.\n\n== 16 Nov 2026 | New card frames\n- Every card now says GHOSTJACK across the top, in both colour themes.\n- New card backs for face-down cards, with the Ghostjack name.\n\n== 16 Nov 2026 | Playtest fixes\n- Shop: tap a booster pack to see every card it can hold, with rarity and how many you own. Tap any card to read it.\n- Opening hand: tap a card in your hand to read what it does before you keep or mulligan.\n- Training: the coach's text box no longer flashes while the CPU is moving.\n- Training: steps that show you something now wait for you to tap NEXT, so they no longer skip past before you can read them.\n\n== 15 Nov 2026 | A new name: Ghostjack\n- GridRunner is now called Ghostjack. Same game, same cards, and your collection, decks and chips are all still here.\n- A new logo on the title screen and the home screen.\n- The game's text no longer mentions other card games by name.\n\n== 15 Nov 2026 | Balance and What's new\n- The Hard Runner CPU plays smarter: it runs more once its breakers are out and pushes when the Corp is one agenda from winning.\n- Starter Corp deck: out go 2 Deep Trace and 2 Leveraged Buyout; in come 2 Paywall, 1 Harrier and a third Tracer Drone. More ice makes the Corp friendlier for new players.\n- If you already play, the new starter cards are added to your collection. Nothing is taken away.\n- This What's new screen. It opens once after each update, and any time from the home screen.\n\n== 15 Nov 2026 | Safety and security\n- In games against a person, the other phone no longer receives your hidden cards: your hand, deck order and face-down cards stay private.\n- Everything the other phone sends is checked first, so tampered or junk messages can't crash your game.\n- Manual fixes are off in games against a person.\n- Block players from the chat or the menu. You won't see their games or messages, and they can't join yours. Unblock them under Play a friend.\n- Chat spam is limited, and updates install only if they really are Ghostjack.\n\n== 15 Nov 2026 | Tablets and computers\n- On tablets and computers the game now fills the screen: a big board, your hand along the bottom, and the full game log on the right.\n- Home, Library, Decks and Shop spread out on wide screens.\n\n== 15 Nov 2026 | New look\n- A title screen: the logo draws itself over a neon grid. Tap to jack in.\n- Angled panels and buttons, a light sweep on the main button, and screens that scan in.\n- The turn banner flares when the turn changes, a run starts or you need to decide.\n\n== 15 Nov 2026 | Open games and chat\n- Open games: see who's hosting and join with one tap. Host as Public or Private.\n- Chat during games against a person, with quick phrases and Mute.\n- The LOG button on the log strip is gone: tap the strip to open the log.\n\n== 15 Nov 2026 | Updates and a tidier home\n- The app tells you when there's a new version and installs it from the home screen.\n- A tidier home screen: one Play card, Play a friend, and four tiles.\n- Share Ghostjack with friends from the home screen.\n- Auto-rotate follows your phone even when Android's rotation lock is on.\n\n== 15 Nov 2026 | Play a friend\n- Play online by room code between Android, iPhone and any browser.\n- Play nearby without internet between two Android phones.\n- Beating a person pays 6 chips.\n\n== 15 Nov 2026 | Collection, training and pace\n- Library, deck builder and Shop. Earn chips from games and lessons, then buy booster packs or single cards.\n- Training: 8 guided lessons covering every Runner and Corp move.\n- The CPU pauses 3 seconds between moves. Change the speed in the menu.\n\n== 13 Nov 2026 | Sound and look\n- A sharper, brighter look.\n- New sound effects and a system announcer voice.\n- Turn your phone sideways for a landscape layout.\n\n== 13 Nov 2026 | First Android version\n- The game comes to Android phones.\n"};</script>
