<script>// Ghostjack rules engine - a JavaScript port of GR_Table_Core.lsl (v2.6).
// Same rules, same card file (GR_Cards.txt), same prompt flow.
// Runs in the browser (window.GR) and in Node (module.exports).
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- cards
  function parseCards(text) {
    const db = {};
    for (let line of text.split(/\r?\n/)) {
      line = line.trim();
      if (!line || line[0] === '#') continue;
      const f = line.split('|');
      if (f.length < 12) continue;
      const t = s => (s || '').trim();
      const id = t(f[0]);
      db[id] = {
        id, side: t(f[1]).toUpperCase(), type: t(f[2]).toUpperCase(), sub: t(f[3]), name: t(f[4]),
        cost: parseInt(f[5]) || 0, str: parseInt(f[6]) || 0, trash: parseInt(f[7]) || 0,
        adv: parseInt(f[8]) || 0, pts: parseInt(f[9]) || 0, mu: parseInt(f[10]) || 0,
        fx: t(f[11]), text: t(f[12]),
      };
    }
    return db;
  }

  function parseDeck(text) {
    let ident = '';
    const cards = [];
    for (let line of text.split(/\r?\n/)) {
      line = line.trim();
      if (!line || line[0] === '#') continue;
      const w = line.split(/\s+/);
      if (w[0].toUpperCase() === 'IDENTITY') { ident = w[1]; continue; }
      const k = parseInt(w[0]) || 0;
      for (let i = 0; i < k; i++) cards.push(w[1]);
    }
    return { ident, cards };
  }

  // effects of one trigger on a card: ["gain 7+bp 1", ...]
  function fxList(db, id, trig) {
    const c = db[id];
    if (!c || !c.fx) return [];
    const out = [];
    for (let p of c.fx.split(';')) {
      p = p.trim();
      const k = p.indexOf(':');
      if (k > 0 && k < p.length - 1 && p.slice(0, k).trim().toUpperCase() === trig) out.push(p.slice(k + 1).trim());
    }
    return out;
  }

  function staticFrom(db, id, key) {
    let t = 0;
    for (const s of fxList(db, id, 'STATIC'))
      for (const v of s.split('+')) {
        const w = v.trim().split(/\s+/);
        if ((w[0] || '').toLowerCase() === key) t += parseInt(w[1]) || 0;
      }
    return t;
  }

  function typeMatch(db, bt, ice) {
    bt = (bt || '').toLowerCase();
    if (bt === 'any' || bt === 'ai') return true;
    const sub = ((db[ice] && db[ice].sub) || '').toLowerCase().replace(/[ \-]/g, '');
    return sub.indexOf(bt) >= 0;
  }

  // seeded random numbers (mulberry32)
  function makeRng(seed) {
    const f = function () {
      let a = f.a | 0; a = (a + 0x6D2B79F5) | 0; f.a = a;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.a = (seed >>> 0) || 1;
    return f;
  }

  function sideName(s) { return s ? 'Runner' : 'Corp'; }

  function sname(code) {
    if (code === 'HQ') return 'HQ';
    if (code === 'RD') return 'R&D';
    if (code === 'AR') return 'Archives';
    if (code === 'RIG') return 'the rig';
    if (code && code[0] === 'S') return 'Server ' + code.slice(1);
    return code;
  }

  function srvCode(s) {
    s = (s || '').trim().toUpperCase();
    if (s === 'R&D' || s === 'RD') return 'RD';
    if (s === 'ARCHIVES' || s === 'AR' || s === 'ARC') return 'AR';
    return s;
  }

  const ctl = (v, a) => ({ who: 9, v, a: String(a), src: 0 });
  // "1 credit", "2 credits", "1 tag" … for the log
  const pl = (n, w, ws) => n + ' ' + (+n === 1 ? w : (ws || w + 's'));
  // an effect code in plain words, for the log and prompts: "trace 3 tag 1" → "Trace 3: give the Runner 1 tag"
  function fxWords(code) {
    const one = it => {
      const w = it.trim().split(/\s+/), v = (w[0] || '').toLowerCase(), n = +w[1] || 0;
      switch (v) {
        case 'etr': return 'end the run';
        case 'net': case 'meat': case 'brain': return 'do ' + n + ' ' + v + ' damage';
        case 'tag': return 'give the Runner ' + pl(n, 'tag');
        case 'loseclick': return 'the Runner loses ' + pl(n, 'click');
        case 'olose': return 'the Runner loses ' + pl(n, 'credit');
        case 'gain': return 'gain ' + pl(n, 'credit');
        case 'draw': return 'draw ' + pl(n, 'card');
        case 'trashprog': return "trash 1 of the Runner's programs";
        case 'bp': return 'take ' + n + ' bad publicity';
        case 'trace': return 'Trace ' + n + (w.length > 2 ? ': if successful, ' + w.slice(2).join(' ').split('&').map(one).join(' and ') : '');
      }
      return it.trim();
    };
    const t = String(code || '').split('+').map(one).join(', then ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  // ---------------------------------------------------------------- the game
  class Game {
    // opts: { db, corp: {ident, cards}, runner: {ident, cards}, seed, invasion }
    constructor(opts) {
      this.db = opts.db;
      this.rng = makeRng(opts.seed || (Date.now() & 0x7fffffff));
      this.cIdent = opts.corp.ident;
      this.rIdent = opts.runner.ident;
      this.cDeck0 = opts.corp.cards.filter(id => this.db[id] && this.db[id].side === 'C');
      this.rDeck0 = opts.runner.cards.filter(id => this.db[id] && this.db[id].side === 'R');
      this.INV = opts.invasion ? 1 : 0;
      this.listeners = [];
      this.reset();
    }

    on(fn) { this.listeners.push(fn); }
    emit(ev) { for (const fn of this.listeners) fn(ev); }

    reset() {
      this.phase = 0; this.active = 0; this.clicks = 0; this.turn = 0;
      this.wait = 0; this.pid = 0; this.pr = null;
      this.cCred = 0; this.cBP = 0; this.cHand = []; this.cRD = []; this.cArch = []; this.cArchDown = []; this.cScore = [];
      this.rCred = 0; this.rTags = 0; this.rBrain = 0; this.rHand = []; this.rStack = []; this.rHeap = []; this.rScore = [];
      this.inst = []; this.nextIid = 1; this.remotes = []; this.nextRemote = 1;
      this.q = []; this.log = [];
      this.runOn = 0; this.runSrv = ''; this.runIce = []; this.runPos = 0; this.runEnc = 0;
      this.runBroken = []; this.runBoost = {}; this.runSucc = ''; this.evtCard = ''; this.brkIid = 0;
      this.trBase = 0; this.trCorp = 0; this.trSucc = ''; this.trSrc = 0;
      this.winner = -1; this.why = '';
    }

    // ---- helpers
    card(id) { return this.db[id] || null; }
    cn(id) { const c = this.db[id]; return c ? c.name : id; }
    ct(id) { const c = this.db[id]; return c ? c.type : ''; }
    isRunnerCard(id) { const c = this.db[id]; return !!c && c.side === 'R'; }
    fx(id, trig) { return fxList(this.db, id, trig); }
    hasFlag(id, flag) { return this.fx(id, 'FLAG').indexOf(flag) >= 0; }
    rand(n) { const r = Math.floor(this.rng() * n); return r >= n ? n - 1 : r; }
    shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = this.rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }

    staticSum(side, k) {
      let tot = 0;
      for (const x of this.inst) {
        if (this.isRunnerCard(x.card) === !!side && (side || x.rez)) tot += staticFrom(this.db, x.card, k);
      }
      tot += staticFrom(this.db, side ? this.rIdent : this.cIdent, k);
      return tot;
    }

    srvExists(code) { return code === 'HQ' || code === 'RD' || code === 'AR' || this.remotes.indexOf(code) >= 0; }

    lg(s) { this.log.push(s); this.emit({ t: 'log', s }); }
    note(side, m) { this.notes.push({ side, m }); this.emit({ t: 'note', side, m }); }

    find(iid) { return this.inst.find(x => x.iid === iid) || null; }
    iCard(iid) { const x = this.find(iid); return x ? x.card : ''; }
    countIce(loc) { return this.inst.filter(x => x.loc === loc && x.slot === 'I').length; }
    iceList(loc) {
      return this.inst.filter(x => x.loc === loc && x.slot === 'I').sort((a, b) => b.ord - a.ord).map(x => x.iid);
    }
    rootMain(loc) {
      const x = this.inst.find(x => x.loc === loc && x.slot === 'R' && (this.ct(x.card) === 'AGENDA' || this.ct(x.card) === 'ASSET'));
      return x ? x.iid : 0;
    }
    addInst(card, loc, slot, rez) {
      const ord = slot === 'I' ? this.countIce(loc) : 0;
      const iid = this.nextIid++;
      this.inst.push({ iid, card, loc, slot, rez: rez ? 1 : 0, adv: 0, host: 0, ord });
      return iid;
    }
    cleanRemote(loc) {
      if (!loc || loc[0] !== 'S') return;
      if (this.inst.some(x => x.loc === loc)) return;
      const p = this.remotes.indexOf(loc);
      if (p >= 0) this.remotes.splice(p, 1);
    }
    delInst(iid) {
      const k = this.inst.findIndex(x => x.iid === iid);
      if (k < 0) return '';
      const x = this.inst[k];
      this.inst.splice(k, 1);
      if (x.slot === 'I') {
        for (const y of this.inst) if (y.loc === x.loc && y.slot === 'I' && y.ord > x.ord) y.ord--;
        if (this.runOn && x.loc === this.runSrv) {
          const p = this.runIce.indexOf(iid);
          if (p >= 0) { this.runIce.splice(p, 1); if (p < this.runPos) this.runPos--; }
        }
      }
      this.cleanRemote(x.loc);
      return x.card;
    }
    trash(iid, faceUp) {
      const x = this.find(iid);
      if (!x) return;
      const rez = x.rez;
      const card = this.delInst(iid);
      if (this.isRunnerCard(card)) this.rHeap.push(card);
      else if (faceUp || rez) this.cArch.push(card);
      else this.cArchDown.push(card);
    }

    addCred(side, n) {
      if (side) { this.rCred = Math.max(0, this.rCred + n); }
      else { this.cCred = Math.max(0, this.cCred + n); }
    }
    cred(side) { return side ? this.rCred : this.cCred; }

    gameOver(winner, why) {
      if (this.phase === 9) return;
      this.phase = 9; this.wait = 0; this.pr = null; this.q = []; this.runOn = 0; this.runEnc = 0;
      this.winner = winner; this.why = why;
      this.lg('*** ' + (winner ? 'RUNNER' : 'CORP') + ' WINS - ' + why + ' ***');
      this.emit({ t: 'over', winner, why });
    }

    draw(side, n) {
      for (let i = 0; i < n; i++) {
        if (side) {
          if (!this.rStack.length) { this.lg("The Runner's stack is empty."); return; }
          this.rHand.push(this.rStack.shift());
        } else {
          if (!this.cRD.length) { this.gameOver(1, 'the Corp had to draw from an empty R&D'); return; }
          this.cHand.push(this.cRD.shift());
        }
      }
    }

    damage(n, kind) {
      if (n <= 0) return;
      this.lg('Runner suffers ' + n + ' ' + kind + ' damage.');
      this.emit({ t: 'damage', n, kind });
      for (let i = 0; i < n; i++) {
        const h = this.rHand.length;
        if (!h) { this.gameOver(0, 'the Runner was flatlined'); return; }
        const r = this.rand(h);
        const c = this.rHand.splice(r, 1)[0];
        this.rHeap.push(c);
        this.lg('  ...trashed from the grip: ' + this.cn(c));
      }
    }

    pts(list) { let t = 0; for (const id of list) t += (this.db[id] ? this.db[id].pts : 0); return t; }
    checkWin() {
      if (this.pts(this.cScore) >= 7) this.gameOver(0, '7 agenda points scored');
      else if (this.pts(this.rScore) >= 7) this.gameOver(1, '7 agenda points stolen');
    }
    handSize(side) { let h = 5 + this.staticSum(side, 'hand'); if (side) h -= this.rBrain; return h; }
    muMax() { return 4 + this.staticSum(1, 'mu'); }
    muUsed() { let t = 0; for (const x of this.inst) if (x.slot === 'P') t += (this.db[x.card] ? this.db[x.card].mu : 0); return t; }
    boostOf(iid) { return this.runBoost[iid] || 0; }
    brkStr(iid) { const c = this.db[this.iCard(iid)]; return (c ? c.str : 0) + this.boostOf(iid); }

    // ---- prompts
    prompt(side, kind, text, opts, data) {
      this.pid++;
      this.wait = side + 1;
      this.pr = { pid: this.pid, side, kind, text, opts, data: data || [] };
      this.emit({ t: 'prompt', side, kind });
    }

    // ---- effect queue
    fxItems(who, verbs, src) {
      const out = [];
      for (let v of verbs.split('+')) {
        v = v.trim();
        let verb = v, arg = '';
        const sp = v.indexOf(' ');
        if (sp > 0) { verb = v.slice(0, sp); arg = v.slice(sp + 1).trim(); }
        if (verb) out.push({ who, v: verb.toLowerCase(), a: arg, src });
      }
      return out;
    }
    queueTrigger(card, trig, who, src, front) {
      let items = [];
      for (const f of this.fx(card, trig)) items = items.concat(this.fxItems(who, f, src));
      this.q = front ? items.concat(this.q) : this.q.concat(items);
    }
    pump() {
      while (this.q.length && this.wait === 0 && this.phase === 2) this.doItem(this.q.shift());
    }

    doItem(it) {
      const who = it.who, v = it.v, a = it.a, src = it.src;
      const n = parseInt(a) || 0;
      const ws = sideName(who);
      if (v === 'gain') { this.addCred(who, n); this.lg(ws + ' gains ' + pl(n, 'credit') + '.'); }
      else if (v === 'lose') { this.addCred(who, -n); this.lg(ws + ' loses ' + pl(n, 'credit') + '.'); }
      else if (v === 'olose') { this.addCred(1 - who, -n); this.lg(sideName(1 - who) + ' loses ' + pl(n, 'credit') + '.'); }
      else if (v === 'draw') { this.draw(who, n); this.lg(ws + ' draws ' + pl(n, 'card') + '.'); }
      else if (v === 'click') { if (this.active === who) this.clicks += n; this.lg(ws + ' gains ' + pl(n, 'click') + '.'); }
      else if (v === 'loseclick') { if (this.active === 1) this.clicks = Math.max(0, this.clicks - n); this.lg('Runner loses ' + pl(n, 'click') + '.'); }
      else if (v === 'tag') { this.rTags += n; this.lg('Runner takes ' + pl(n, 'tag') + '.'); this.emit({ t: 'tag', n }); }
      else if (v === 'untag') { this.rTags = Math.max(0, this.rTags - n); this.lg('Runner removes ' + pl(n, 'tag') + '.'); }
      else if (v === 'bp') { this.cBP += n; this.lg('Corp takes ' + n + ' bad publicity.'); }
      else if (v === 'net' || v === 'meat') this.damage(n, v);
      else if (v === 'brain') { this.rBrain += n; this.damage(n, 'brain'); }
      else if (v === 'netadv') { const x = this.find(src); this.damage(n * (x ? x.adv : 0), 'net'); }
      else if (v === 'etr') {
        if (this.runOn) { this.lg('Subroutine ends the run.'); this.q = []; this.endRun(0); }
      }
      else if (v === 'trashprog') this.trashProgPrompt();
      else if (v === 'trace') this.startTrace(a, src);
      else if (v === 'run') {
        this.runSucc = '';
        if (this.evtCard) { const s = this.fx(this.evtCard, 'SUCCESS'); if (s.length) this.runSucc = s[0]; }
        this.evtCard = '';
        const sv = srvCode(a);
        if (sv === '' || sv === 'ANY') this.serverPrompt();
        else if (this.srvExists(sv)) this.startRun(sv);
        else this.lg('That server does not exist - run cancelled.');
      }
      else if (v === 'load') {
        const x = this.find(src);
        if (x) { x.host += n; this.lg(this.cn(x.card) + ' is loaded with ' + pl(n, 'credit') + '.'); }
      }
      else if (v === 'take') {
        const x = this.find(src);
        if (x) {
          const h = x.host, t = Math.min(n, h);
          x.host = h - t;
          this.addCred(who, t);
          const tc = x.card;
          this.lg(ws + ' takes ' + pl(t, 'credit') + ' from ' + this.cn(tc) + '.');
          if (h - t <= 0) { this.trash(src, true); this.lg(this.cn(tc) + ' is empty and is trashed.'); }
        }
      }
      else if (v === 'trashself') { const sc = this.iCard(src); if (sc) { this.trash(src, true); this.lg(this.cn(sc) + ' is trashed.'); } }
      else if (v === '@approach') this.approach();
      else if (v === '@enc') this.encounter(parseInt(a));
      else if (v === '@passice') this.passIce();
      else if (v === '@server') this.reachServer();
      else if (v === '@access') this.buildAccess();
      else if (v === '@acc') this.accessOne(a);
      else if (v === '@accdec') this.accessDecide(a);
      else if (v === '@runend') this.endRun(parseInt(a));
      else if (v === '@sub') this.lg('Unbroken subroutine fires: ' + fxWords(a) + '.');
      else this.lg("Effect '" + v + ' ' + a + "' is not automated - resolve it with Manual fixes.");
    }

    // ---- traces
    startTrace(a, src) {
      const w = a.split(/\s+/).filter(Boolean);
      this.trBase = parseInt(w[0]) || 0;
      this.trSucc = w.length > 1 ? w.slice(1).join(' ').split('&').filter(Boolean).join('+') : '';
      this.trSrc = src;
      this.lg('Trace ' + this.trBase + ' is initiated.');
      const o = [];
      const mx = Math.min(this.cCred, 10);
      for (let k = 0; k <= mx; k++) o.push(String(k));
      this.prompt(0, 'trace1', 'Trace ' + this.trBase + '. Spend how many credits to boost the trace? (you have ' + this.cCred + ')', o, []);
    }

    // ---- runs
    serverPrompt() {
      const o = ['HQ', 'R&D', 'Archives'], d = ['HQ', 'RD', 'AR'];
      for (const r of this.remotes) { o.push(sname(r)); d.push(r); }
      this.prompt(1, 'runsrv', 'Choose a server to run.', o, d);
    }
    startRun(srv) {
      this.runOn = 1; this.runSrv = srv; this.runIce = this.iceList(srv); this.runPos = 0; this.runEnc = 0;
      this.runBroken = []; this.runBoost = {};
      this.lg('Runner initiates a run on ' + sname(srv) + '.');
      this.emit({ t: 'run', srv });
      if (this.cBP > 0) { this.rCred += this.cBP; this.lg('Runner gains ' + pl(this.cBP, 'credit') + " from the Corp's bad publicity."); }
      this.q.unshift(ctl('@approach', ''));
    }
    approach() {
      if (!this.runOn) return;
      if (this.runPos >= this.runIce.length) { this.q.unshift(ctl('@server', '')); return; }
      const iid = this.runIce[this.runPos];
      const x = this.find(iid);
      if (!x) { this.runPos++; this.q.unshift(ctl('@approach', '')); return; }
      this.lg('Runner approaches ice ' + (this.runPos + 1) + ' of ' + this.runIce.length + ' on ' + sname(this.runSrv) + '.');
      if (!x.rez) {
        const cost = this.db[x.card].cost;
        if (this.cCred >= cost) {
          this.prompt(0, 'rezice', 'The Runner approaches your ' + this.cn(x.card) + ' on ' + sname(this.runSrv) + '. Rez it for ' + cost + ' credits?', ['Rez it', "Don't rez"], [iid]);
          return;
        }
        this.lg('The ice stays unrezzed.');
        this.passIce();
        return;
      }
      this.encounter(iid);
    }
    subsDesc() {
      const subs = this.fx(this.iCard(this.runEnc), 'SUB');
      if (!subs.length) return 'none';
      return subs.map((s, i) => (i + 1) + ') ' + fxWords(s) + (this.runBroken[i] ? ' [broken]' : '')).join('  ');
    }
    encounter(iid) {
      if (!this.runOn) return;
      this.runEnc = iid; this.runBroken = []; this.runBoost = {};
      const card = this.iCard(iid);
      for (let i = 0; i < this.fx(card, 'SUB').length; i++) this.runBroken.push(0);
      this.lg('Runner encounters ' + this.cn(card) + ' (strength ' + this.db[card].str + ').');
      this.emit({ t: 'encounter', iid });
      this.breakPrompt();
    }
    breakPrompt() {
      const ice = this.iCard(this.runEnc);
      const istr = this.db[ice].str;
      const o = [], d = [];
      const unbroken = this.runBroken.indexOf(0) >= 0;
      for (const x of this.inst) {
        if (x.slot !== 'P') continue;
        const b = this.fx(x.card, 'BREAK');
        if (!b.length) continue;
        const bw = b[0].split(/\s+/);
        if (!typeMatch(this.db, bw[0], ice)) continue;
        const s = this.brkStr(x.iid);
        if (unbroken && s >= istr) { o.push('Break: ' + this.cn(x.card)); d.push(['B', x.iid]); }
        const bo = this.fx(x.card, 'BOOST');
        if (s < istr && bo.length) { o.push('Boost ' + this.cn(x.card) + ' ' + bo[0].split(/\s+/)[0] + 'c'); d.push(['U', x.iid]); }
      }
      o.push('Done - let subs fire'); d.push(['D', 0]);
      this.prompt(1, 'brk', 'Encountering ' + this.cn(ice) + ' (str ' + istr + '). Subroutines: ' + this.subsDesc() + '. You have ' + this.rCred + ' credits.', o, d);
    }
    subPrompt() {
      const subs = this.fx(this.iCard(this.runEnc), 'SUB');
      const o = [], d = [];
      subs.forEach((s, i) => { if (!this.runBroken[i]) { o.push('Sub ' + (i + 1) + ': ' + fxWords(s)); d.push(i); } });
      o.push('Back'); d.push(-1);
      const b = (this.fx(this.iCard(this.brkIid), 'BREAK')[0] || '').split(/\s+/);
      this.prompt(1, 'brksub', this.cn(this.iCard(this.brkIid)) + ' breaks ' + pl(b[2] || '1', 'subroutine') + ' for ' + pl(b[1] || '0', 'credit') + '. Which subroutine?', o, d);
    }
    breakSub(iid, k) {
      const bc = this.iCard(iid);
      const b = (this.fx(bc, 'BREAK')[0] || '').split(/\s+/);
      const cost = parseInt(b[1]) || 0;
      const cnt = Math.max(1, parseInt(b[2]) || 0);
      if (this.rCred < cost) { this.note(1, 'Not enough credits to break that.'); return; }
      this.rCred -= cost;
      let j = k, done = 0;
      while (j < this.runBroken.length && done < cnt) { if (!this.runBroken[j]) { this.runBroken[j] = 1; done++; } j++; }
      this.lg('Runner spends ' + pl(cost, 'credit') + ' to break ' + pl(done, 'subroutine') + ' with ' + this.cn(bc) + '.');
      this.emit({ t: 'break' });
    }
    boostBreaker(iid) {
      const bc = this.iCard(iid);
      const b = (this.fx(bc, 'BOOST')[0] || '').split(/\s+/);
      const cost = parseInt(b[0]) || 0, amt = parseInt(b[1]) || 0;
      if (this.rCred < cost) { this.note(1, 'Not enough credits to boost.'); return; }
      this.rCred -= cost;
      this.runBoost[iid] = (this.runBoost[iid] || 0) + amt;
      this.lg('Runner boosts ' + this.cn(bc) + ' to strength ' + this.brkStr(iid) + '.');
    }
    fireSubs() {
      const subs = this.fx(this.iCard(this.runEnc), 'SUB');
      let items = [];
      subs.forEach((s, i) => {
        if (!this.runBroken[i]) { items.push(ctl('@sub', s)); items = items.concat(this.fxItems(0, s, this.runEnc)); }
      });
      items.push(ctl('@passice', ''));
      this.q = items.concat(this.q);
    }
    passIce() {
      if (!this.runOn) return;
      this.runEnc = 0; this.runBroken = []; this.runBoost = {};
      this.runPos++;
      if (this.runPos < this.runIce.length) this.prompt(1, 'jack', 'Ice passed. Continue the run or jack out?', ['Continue', 'Jack out'], []);
      else this.prompt(1, 'jack', 'All ice passed. Continue to ' + sname(this.runSrv) + ' or jack out?', ['Continue', 'Jack out'], []);
    }
    reachServer() {
      if (!this.runOn) return;
      this.lg('The run on ' + sname(this.runSrv) + ' is successful.');
      if (this.INV && this.runSrv !== 'AR') { this.gameOver(1, 'the slice broke into ' + sname(this.runSrv)); return; }
      let items = [];
      if (this.runSucc) items = items.concat(this.fxItems(1, this.runSucc, 0));
      items.push(ctl('@access', ''));
      this.q = items.concat(this.q);
    }
    buildAccess() {
      if (!this.runOn) return;
      const acc = [];
      if (this.runSrv === 'HQ') {
        let k = 1 + this.staticSum(1, 'hqacc');
        const sh = this.shuffle(this.cHand);
        k = Math.min(k, sh.length);
        for (let i = 0; i < k; i++) acc.push(ctl('@acc', 'H' + sh[i]));
      } else if (this.runSrv === 'RD') {
        let k = 1 + this.staticSum(1, 'rdacc');
        k = Math.min(k, this.cRD.length);
        for (let i = 0; i < k; i++) acc.push(ctl('@acc', 'D' + this.cRD[i]));
      } else if (this.runSrv === 'AR') {
        if (this.cArchDown.length) this.lg('All facedown cards in Archives are turned faceup.');
        this.cArch = this.cArch.concat(this.cArchDown);
        this.cArchDown = [];
        for (const c of this.cArch) acc.push(ctl('@acc', 'A' + c));
      }
      for (const x of this.inst) if (x.loc === this.runSrv && x.slot === 'R') acc.push(ctl('@acc', 'I' + x.iid));
      if (!acc.length) this.lg('There is nothing to access.');
      acc.push(ctl('@runend', '1'));
      this.q = acc.concat(this.q);
    }
    refCard(ref) {
      const t = ref[0], r = ref.slice(1);
      if (t === 'I') return this.iCard(parseInt(r));
      if (t === 'H' && this.cHand.indexOf(r) >= 0) return r;
      if (t === 'D' && this.cRD.indexOf(r) >= 0) return r;
      if (t === 'A' && this.cArch.indexOf(r) >= 0) return r;
      return '';
    }
    refWhere(ref) {
      const t = ref[0];
      if (t === 'H') return 'HQ';
      if (t === 'D') return 'R&D';
      if (t === 'A') return 'Archives';
      return sname(this.runSrv);
    }
    removeRef(ref) {
      const t = ref[0], r = ref.slice(1);
      const rm = (l) => { const p = l.indexOf(r); if (p >= 0) l.splice(p, 1); };
      if (t === 'I') this.delInst(parseInt(r));
      else if (t === 'H') rm(this.cHand);
      else if (t === 'D') rm(this.cRD);
      else if (t === 'A') rm(this.cArch);
    }
    accessOne(ref) {
      const c = this.refCard(ref);
      if (!c) return;
      const src = ref[0] === 'I' ? parseInt(ref.slice(1)) : 0;
      this.lg('Runner accesses ' + this.cn(c) + ' in ' + this.refWhere(ref) + '.');
      this.emit({ t: 'access', card: c });
      let items = [];
      for (const f of this.fx(c, 'ACCESS')) items = items.concat(this.fxItems(0, f, src));
      items.push(ctl('@accdec', ref));
      this.q = items.concat(this.q);
    }
    accessDecide(ref) {
      const c = this.refCard(ref);
      if (!c) return;
      const ty = this.ct(c);
      if (ty === 'AGENDA') {
        this.removeRef(ref);
        this.rScore.push(c);
        this.lg('Runner steals ' + this.cn(c) + ' (' + pl(this.db[c].pts, 'point') + ').');
        this.emit({ t: 'steal', card: c });
        this.queueTrigger(c, 'STOLEN', 0, 0, true);
        this.checkWin();
        return;
      }
      const tc = this.db[c].trash;
      if (tc > 0 && ref[0] !== 'A' && (ty === 'ASSET' || ty === 'UPGRADE')) {
        if (this.rCred >= tc) this.prompt(1, 'trashacc', 'You accessed ' + this.cn(c) + '. Pay ' + tc + ' credits to trash it?', ['Trash it (' + tc + 'c)', 'Leave it'], [ref]);
        else this.lg('Runner cannot afford to trash ' + this.cn(c) + '.');
      }
    }
    endRun(ok) {
      if (!this.runOn) return;
      const s = sname(this.runSrv);
      this.runOn = 0; this.runEnc = 0; this.runIce = []; this.runBroken = []; this.runBoost = {};
      this.runPos = 0; this.runSucc = ''; this.runSrv = '';
      this.lg(ok ? 'The run on ' + s + ' is over.' : 'The run on ' + s + ' ends unsuccessfully.');
      this.emit({ t: 'runend', ok });
    }
    trashProgPrompt() {
      const o = [], d = [];
      for (const x of this.inst) if (x.slot === 'P') { o.push(this.cn(x.card)); d.push(x.iid); }
      if (!o.length) { this.lg('The Runner has no program to trash.'); return; }
      this.prompt(0, 'trashprog', 'Choose a Runner program to trash.', o, d);
    }

    // ---- turns
    startTurn(side) {
      this.active = side;
      this.clicks = 3 + side + this.staticSum(side, 'clicks');
      if (side === 0) this.turn++;
      if (this.INV && this.turn > 1) { this.gameOver(0, 'the Corp held off the slice'); return; }
      this.lg('--- Turn ' + this.turn + ': ' + sideName(side) + ' has ' + pl(this.clicks, 'click') + ' ---');
      this.emit({ t: 'turn', side });
      for (const x of this.inst)
        if (this.isRunnerCard(x.card) === !!side && (side || x.rez)) this.queueTrigger(x.card, 'TURN', side, x.iid, false);
      if (side) this.queueTrigger(this.rIdent, 'TURN', 1, 0, false);
      else { this.queueTrigger(this.cIdent, 'TURN', 0, 0, false); this.q.push({ who: 0, v: 'draw', a: '1', src: 0 }); }
      this.pump();
    }
    discardCheck(side) {
      const h = side ? this.rHand : this.cHand;
      const mx = this.handSize(side);
      if (side === 1 && mx < 0) { this.gameOver(0, "the Runner's maximum hand size fell below zero"); return; }
      if (h.length > mx) {
        this.prompt(side, 'disc', 'End of turn: discard down to ' + mx + ' cards. Choose a card to discard.', h.map(c => this.cn(c)), h.slice());
        return;
      }
      this.lg(sideName(side) + ' ends the turn.');
      this.startTurn(1 - side);
    }
    discardFromHand(side, i) {
      if (side) {
        if (i < 0 || i >= this.rHand.length) return;
        const c = this.rHand.splice(i, 1)[0];
        this.rHeap.push(c);
        this.lg('Runner discards ' + this.cn(c) + '.');
      } else {
        if (i < 0 || i >= this.cHand.length) return;
        const c = this.cHand.splice(i, 1)[0];
        this.cArchDown.push(c);
        this.lg('Corp discards a card from HQ.');
      }
    }
    canClick(side) {
      if (side !== this.active) { this.note(side, 'It is not your turn.'); return false; }
      if (this.clicks < 1) { this.note(side, 'No clicks left - press End Turn.'); return false; }
      return true;
    }

    // ---- player actions
    installCorp(hidx, target) {
      if (hidx < 0 || hidx >= this.cHand.length) return;
      const c = this.cHand[hidx], t = this.ct(c);
      if (t === 'OPERATION') { this.note(0, 'Operations are played, not installed.'); return; }
      if (t === 'IDENTITY') return;
      if (target !== 'NEW' && !this.srvExists(target)) { this.note(0, 'That server does not exist.'); return; }
      const remote = target === 'NEW' || target[0] === 'S';
      if ((t === 'AGENDA' || t === 'ASSET') && !remote) { this.note(0, 'Agendas and assets can only go in a remote server.'); return; }
      const tax = (t === 'ICE' && target !== 'NEW') ? this.countIce(target) : 0;
      if (this.cCred < tax) { this.note(0, 'You need ' + tax + ' credits to install ice there.'); return; }
      if (!this.canClick(0)) return;
      this.clicks--;
      this.cCred -= tax;
      let loc = target;
      if (target === 'NEW') { loc = 'S' + this.nextRemote++; this.remotes.push(loc); }
      const old = (t === 'AGENDA' || t === 'ASSET') ? this.rootMain(loc) : 0;
      this.cHand.splice(hidx, 1);
      const iid = this.addInst(c, loc, t === 'ICE' ? 'I' : 'R', 0);
      if (t === 'ICE') this.lg('Corp installs ice protecting ' + sname(loc) + (tax ? ' (paid ' + pl(tax, 'credit') + ').' : '.'));
      else this.lg('Corp installs a card in ' + sname(loc) + '.');
      if (old) { this.trash(old, false); this.lg('The card previously in ' + sname(loc) + ' is trashed.'); }
      this.note(0, 'Installed ' + this.cn(c) + ' in ' + sname(loc) + '.');
      this.queueTrigger(c, 'INSTALL', 0, iid, false);
    }
    installRunner(hidx) {
      if (hidx < 0 || hidx >= this.rHand.length) return;
      const c = this.rHand[hidx], t = this.ct(c);
      const slot = t === 'PROGRAM' ? 'P' : t === 'HARDWARE' ? 'H' : t === 'RESOURCE' ? 'S' : '';
      if (!slot) { this.note(1, 'Only programs, hardware and resources can be installed.'); return; }
      const cost = this.db[c].cost;
      if (this.rCred < cost) { this.note(1, 'You need ' + cost + ' credits.'); return; }
      if (slot === 'P' && this.muUsed() + this.db[c].mu > this.muMax()) { this.note(1, 'Not enough memory. Trash a program first (tap it > Trash).'); return; }
      if (!this.canClick(1)) return;
      this.clicks--;
      this.rCred -= cost;
      this.rHand.splice(hidx, 1);
      const iid = this.addInst(c, 'RIG', slot, 1);
      this.lg('Runner installs ' + this.cn(c) + ' (' + cost + 'c).');
      this.queueTrigger(c, 'INSTALL', 1, iid, false);
    }
    playCard(side, hidx) {
      const h = side ? this.rHand : this.cHand;
      if (hidx < 0 || hidx >= h.length) return;
      const c = h[hidx], t = this.ct(c);
      if ((side === 0 && t !== 'OPERATION') || (side === 1 && t !== 'EVENT')) { this.note(side, 'That card is installed, not played.'); return; }
      if (this.fx(c, 'REQ').indexOf('tagged') >= 0 && this.rTags === 0) { this.note(side, 'You can only play that while the Runner is tagged.'); return; }
      const cost = this.db[c].cost;
      if (this.cred(side) < cost) { this.note(side, 'You need ' + cost + ' credits.'); return; }
      if (!this.canClick(side)) return;
      this.clicks--;
      this.addCred(side, -cost);
      h.splice(hidx, 1);
      if (side) { this.rHeap.push(c); this.evtCard = c; }
      else { this.cArch.push(c); this.evtCard = ''; }
      this.lg(sideName(side) + ' plays ' + this.cn(c) + '.');
      this.queueTrigger(c, 'PLAY', side, 0, false);
    }
    ability(side, iid) {
      const x = this.find(iid);
      if (!x) return;
      if (this.isRunnerCard(x.card) !== !!side) { this.note(side, 'That is not your card.'); return; }
      if (side === 0 && !x.rez) { this.note(0, 'Rez it first.'); return; }
      const cl = this.fx(x.card, 'CLICK');
      if (!cl.length) { this.note(side, 'That card has no click ability.'); return; }
      if (!this.canClick(side)) return;
      this.clicks--;
      this.evtCard = '';
      this.lg(sideName(side) + ' uses ' + this.cn(x.card) + '.');
      this.q = this.q.concat(this.fxItems(side, cl[0], iid));
    }
    advance(iid) {
      const x = this.find(iid);
      if (!x || this.isRunnerCard(x.card)) return;
      if (!(this.ct(x.card) === 'AGENDA' || this.hasFlag(x.card, 'adv'))) { this.note(0, 'That card cannot be advanced.'); return; }
      if (this.cCred < 1) { this.note(0, 'Advancing costs 1 credit.'); return; }
      if (!this.canClick(0)) return;
      this.clicks--; this.cCred--; x.adv++;
      this.lg('Corp advances a card in ' + sname(x.loc) + ' (now ' + x.adv + ').');
    }
    rezAction(iid) {
      const x = this.find(iid);
      if (!x || this.isRunnerCard(x.card)) return;
      const t = this.ct(x.card);
      if (x.rez) { this.note(0, 'Already rezzed.'); return; }
      if (t === 'AGENDA') { this.note(0, 'Agendas are scored, not rezzed.'); return; }
      if (t === 'ICE') { this.note(0, 'Ice is rezzed when the Runner approaches it.'); return; }
      const cost = this.db[x.card].cost;
      if (this.cCred < cost) { this.note(0, 'You need ' + cost + ' credits to rez that.'); return; }
      this.cCred -= cost; x.rez = 1;
      this.lg('Corp rezzes ' + this.cn(x.card) + ' (' + cost + 'c).');
      this.queueTrigger(x.card, 'REZ', 0, iid, false);
    }
    scoreAction(iid) {
      const x = this.find(iid);
      if (!x) return;
      const c = x.card;
      if (this.ct(c) !== 'AGENDA') { this.note(0, 'Only agendas can be scored.'); return; }
      if (this.active !== 0) { this.note(0, 'Agendas are scored during your own turn.'); return; }
      if (x.adv < this.db[c].adv) { this.note(0, 'It needs ' + this.db[c].adv + ' advancement tokens.'); return; }
      this.delInst(iid);
      this.cScore.push(c);
      this.lg('Corp scores ' + this.cn(c) + ' (' + pl(this.db[c].pts, 'point') + ').');
      this.emit({ t: 'score', card: c });
      this.queueTrigger(c, 'SCORE', 0, 0, false);
      this.checkWin();
    }
    trashRes(iid) {
      const x = this.find(iid);
      if (!x) return;
      if (x.slot !== 'S') { this.note(0, 'You can only trash resources this way.'); return; }
      if (this.rTags < 1) { this.note(0, 'The Runner must be tagged.'); return; }
      if (this.cCred < 2) { this.note(0, 'Trashing a resource costs 2 credits.'); return; }
      if (!this.canClick(0)) return;
      this.clicks--; this.cCred -= 2;
      const c = x.card;
      this.trash(iid, true);
      this.lg("Corp trashes the Runner's " + this.cn(c) + '.');
    }
    runAction(code) {
      if (!this.srvExists(code)) { this.note(1, 'That server does not exist.'); return; }
      if (!this.canClick(1)) return;
      this.clicks--;
      this.evtCard = ''; this.runSucc = '';
      this.startRun(code);
    }
    untag() {
      if (this.rTags < 1) { this.note(1, 'You have no tags.'); return; }
      if (this.rCred < 2) { this.note(1, 'Removing a tag costs 2 credits.'); return; }
      if (!this.canClick(1)) return;
      this.clicks--; this.rCred -= 2; this.rTags--;
      this.lg('Runner removes a tag.');
    }
    manual(side, v, a, b) {
      const who = sideName(side);
      const d = parseInt(b) || 0;
      if (v === 'adj') {
        if (a === 'cred') { this.addCred(side, d); this.lg(who + ' adjusts credits by ' + b + ' (manual).'); }
        else if (a === 'click') { if (side === this.active) { this.clicks = Math.max(0, this.clicks + d); this.lg(who + ' adjusts clicks by ' + b + ' (manual).'); } }
        else if (a === 'tag') { this.rTags = Math.max(0, this.rTags + d); this.lg(who + ' adjusts Runner tags by ' + b + ' (manual).'); }
        else if (a === 'bp') { this.cBP = Math.max(0, this.cBP + d); this.lg(who + ' adjusts bad publicity by ' + b + ' (manual).'); }
        else if (a === 'brain') { this.rBrain = Math.max(0, this.rBrain + d); this.lg(who + ' adjusts brain damage by ' + b + ' (manual).'); }
        return;
      }
      const iid = parseInt(a);
      const x = this.find(iid);
      if (v === 'mdraw') { this.draw(side, 1); this.lg(who + ' draws 1 card (manual).'); }
      else if (v === 'mdisc') this.discardFromHand(side, parseInt(a));
      else if (v === 'mshuf') {
        if (side) this.rStack = this.shuffle(this.rStack); else this.cRD = this.shuffle(this.cRD);
        this.lg(who + ' shuffles their deck (manual).');
      }
      else if (v === 'mend') { if (this.runOn) { this.q = []; this.wait = 0; this.pr = null; this.endRun(0); this.lg(who + ' ended the run (manual).'); } }
      else if (x) {
        const c = x.card;
        if (v === 'mtrash') { this.trash(iid, true); this.lg(who + ' trashes ' + this.cn(c) + ' (manual).'); }
        else if (v === 'mrez') {
          if (side !== 0 || this.isRunnerCard(c)) return;
          if (x.rez) { x.rez = 0; this.lg('Corp derezzes ' + this.cn(c) + ' (manual).'); }
          else { x.rez = 1; this.lg('Corp rezzes ' + this.cn(c) + ' without paying (manual).'); }
        }
        else if (v === 'madv') { x.adv = Math.max(0, x.adv + d); this.lg(who + ' sets advancement on a card in ' + sname(x.loc) + ' to ' + x.adv + ' (manual).'); }
        else if (v === 'mhost') { x.host = Math.max(0, x.host + d); this.lg(who + ' sets hosted credits on a card to ' + x.host + ' (manual).'); }
      }
    }

    // A player's action. Returns the notes (refusals/messages) it produced.
    act(side, v, a2, a3) {
      this.notes = [];
      a2 = a2 === undefined ? '' : String(a2);
      a3 = a3 === undefined ? '' : String(a3);
      if (this.phase !== 2) { this.note(side, 'No game in progress.'); return this.done(); }
      if (v === 'adj' || v[0] === 'm') { this.manual(side, v, a2, a3); this.pump(); return this.done(); }
      if (this.wait !== 0) { this.note(side, 'Waiting for a decision.'); return this.done(); }
      if (this.runOn) { this.note(side, 'A run is in progress.'); return this.done(); }
      if (v === 'credit') { if (this.canClick(side)) { this.clicks--; this.addCred(side, 1); this.lg(sideName(side) + ' takes 1 credit.'); } }
      else if (v === 'draw') { if (this.canClick(side)) { this.clicks--; this.draw(side, 1); this.lg(sideName(side) + ' draws a card.'); } }
      else if (v === 'install') { if (side) this.installRunner(parseInt(a2)); else this.installCorp(parseInt(a2), a3); }
      else if (v === 'play') this.playCard(side, parseInt(a2));
      else if (v === 'ability') this.ability(side, parseInt(a2));
      else if (v === 'endturn') { if (side !== this.active) this.note(side, 'It is not your turn.'); else this.discardCheck(side); }
      else if (side === 0 && v === 'advance') this.advance(parseInt(a2));
      else if (side === 0 && v === 'rez') this.rezAction(parseInt(a2));
      else if (side === 0 && v === 'score') this.scoreAction(parseInt(a2));
      else if (side === 0 && v === 'trashres') this.trashRes(parseInt(a2));
      else if (side === 1 && v === 'run') this.runAction(srvCode(a2));
      else if (side === 1 && v === 'untag') this.untag();
      else this.note(side, 'That action is not available to you.');
      this.pump();
      return this.done();
    }
    done() { this.emit({ t: 'state' }); return this.notes; }

    // Answer the pending prompt with option index ch.
    choose(side, ch) {
      this.notes = [];
      if (!this.pr || this.wait !== side + 1) return this.done();
      if (!(ch >= 0 && ch < this.pr.opts.length)) return this.done();
      const k = this.pr.kind, d = this.pr.data, ws = this.wait - 1;
      this.wait = 0; this.pr = null;

      if (k === 'mull') {
        if (ch === 1) {
          if (ws) { this.rStack = this.shuffle(this.rStack.concat(this.rHand)); this.rHand = []; }
          else { this.cRD = this.shuffle(this.cRD.concat(this.cHand)); this.cHand = []; }
          this.draw(ws, 5);
          this.lg(sideName(ws) + ' takes a mulligan.');
        } else this.lg(sideName(ws) + ' keeps their hand.');
        if (ws === 0) this.prompt(1, 'mull', 'Opening hand dealt. Keep it, or mulligan (shuffle it back and draw 5 new)?', ['Keep', 'Mulligan'], []);
        else { this.phase = 2; this.startTurn(0); }
      }
      else if (k === 'rezice') {
        const iid = d[0];
        const x = this.find(iid);
        if (ch === 0 && x) {
          const cost = this.db[x.card].cost;
          if (this.cCred >= cost) {
            this.cCred -= cost; x.rez = 1;
            this.lg('Corp rezzes ' + this.cn(x.card) + ' (' + cost + 'c).');
            this.emit({ t: 'rez', card: x.card });
            let items = [];
            for (const f of this.fx(x.card, 'REZ')) items = items.concat(this.fxItems(0, f, iid));
            this.q = items.concat([ctl('@enc', iid)], this.q);
            this.pump();
            return this.done();
          }
        }
        this.lg('Corp does not rez the ice.');
        this.passIce();
      }
      else if (k === 'jack') {
        if (ch === 0) this.q.unshift(ctl('@approach', ''));
        else { this.lg('Runner jacks out.'); this.endRun(0); }
      }
      else if (k === 'brk') {
        const [kind, biid] = d[ch];
        if (kind === 'D') this.fireSubs();
        else if (kind === 'U') { this.boostBreaker(biid); this.breakPrompt(); }
        else if (kind === 'B') { this.brkIid = biid; this.subPrompt(); }
      }
      else if (k === 'brksub') {
        const sk = d[ch];
        if (sk >= 0) this.breakSub(this.brkIid, sk);
        this.breakPrompt();
      }
      else if (k === 'disc') { this.discardFromHand(ws, ch); this.discardCheck(ws); }
      else if (k === 'trashprog') {
        const tp = d[ch];
        const pc = this.iCard(tp);
        this.trash(tp, true);
        this.lg("Corp trashes the Runner's " + this.cn(pc) + '.');
      }
      else if (k === 'trace1') {
        this.cCred -= ch;
        this.trCorp = this.trBase + ch;
        this.lg('Corp spends ' + pl(ch, 'credit') + ' - trace strength ' + this.trCorp + '.');
        const lk = this.staticSum(1, 'link');
        const o = [];
        const mx = Math.min(this.rCred, 10);
        for (let j = 0; j <= mx; j++) o.push(String(j));
        this.prompt(1, 'trace2', 'Trace strength is ' + this.trCorp + '. Your link is ' + lk + '. Spend credits to boost link? (you have ' + this.rCred + ')', o, [this.trCorp, lk]);
      }
      else if (k === 'trace2') {
        this.rCred -= ch;
        const rl = this.staticSum(1, 'link') + ch;
        this.lg('Runner spends ' + pl(ch, 'credit') + ' - link strength ' + rl + '.');
        if (this.trCorp > rl) {
          this.lg('The trace is successful.');
          if (this.trSucc) this.q = this.fxItems(0, this.trSucc, this.trSrc).concat(this.q);
        } else this.lg('The trace fails.');
      }
      else if (k === 'runsrv') this.startRun(d[ch]);
      else if (k === 'trashacc') {
        if (ch === 0) {
          const ref = d[0];
          const tcard = this.refCard(ref);
          const tc = tcard ? this.db[tcard].trash : 0;
          if (tcard && this.rCred >= tc) {
            this.rCred -= tc;
            this.removeRef(ref);
            this.cArch.push(tcard);
            this.lg('Runner pays ' + pl(tc, 'credit') + ' to trash ' + this.cn(tcard) + '.');
          }
        }
      }
      this.pump();
      return this.done();
    }

    start() {
      this.reset();
      this.cRD = this.shuffle(this.cDeck0);
      this.rStack = this.shuffle(this.rDeck0);
      this.cCred = 5 + 3 * this.INV;
      this.rCred = 5;
      this.phase = 1;
      this.notes = [];
      this.draw(0, 5);
      this.draw(1, 5);
      this.lg('New game: ' + this.cn(this.cIdent) + ' vs ' + this.cn(this.rIdent) + '.');
      this.prompt(0, 'mull', 'Opening hand dealt. Keep it, or mulligan (shuffle it back and draw 5 new)?', ['Keep', 'Mulligan'], []);
      this.emit({ t: 'state' });
    }

    // Save / restore everything but the card database (for resuming on a phone)
    save() {
      const o = {};
      for (const k of Object.keys(this)) if (k !== 'db' && k !== 'listeners' && k !== 'rng' && k !== 'notes') o[k] = this[k];
      o.rngA = this.rng.a;
      return JSON.parse(JSON.stringify(o));
    }
    load(o) {
      for (const k of Object.keys(o)) if (k !== 'rngA') this[k] = o[k];
      this.rng.a = o.rngA;
      this.notes = [];
    }

    // What one side may see (side 2 = spectator). Mirrors buildState().
    view(side) {
      return {
        phase: this.phase, active: this.active, clicks: this.clicks, turn: this.turn,

  // ------------------------------------------------------------ invasions: raids between players (rules in raid.js)
  // While Invasions are on (or you're Wanted) and you're not in a game with someone, a "raid post" lists you in
  // Open games (a Beacon with r:1) and hosts a room. A raider joins it and says hello {raid: 1}; you get a minute to
  // DEFEND. Wanted players can't refuse: if they don't answer, the CPU defends for them.
  const RD = GR.Raid;
  function raidSt() {
    const raw = store.get('raid', null), hot0 = raw && raw.hot, t = RD.tick(raw);
    if (t.kept && hot0) {
      if (boardOn()) { t.st.cooled = { id: hot0.id, until: hot0.until, from: hot0.from }; setTimeout(boardSync, 0); }   // the board says if it was taken first
      else if (db[t.kept]) setTimeout(() => toast('The heat is off: ' + db[t.kept].name + ' is yours to keep'), 400);
    }
    if (JSON.stringify(raw) !== JSON.stringify(t.st)) store.set('raid', t.st);
    return t.st;
  }
  const raidSave = st => store.set('raid', st);
  function raidInfo(code) {
    const st = raidSt();
    return { v: NET_V, b: BUILD, n: netName(), i: myId(), c: code, t: Date.now(), r: 1, s: 0, d: deckAt(0, activeIdx(0)).name,
      w: st.hot ? { c: st.hot.id, u: st.hot.until } : 0, h: st.hacked ? 1 : 0 };
  }
  function raidPostSync() {
    const st = raidSt(), want = onlineOk() && RD.open(st) && !A.net && !A.raidIn && Date.now() >= (A.postRetry || 0) && !A.tut;
    if (want && !A.post) raidPostStart();
    else if (!want && A.post && !A.raidIn) raidPostStop();
    else if (A.post && A.post.beacon) A.post.beacon.update(raidInfo(A.post.code));
  }
  function raidPostStart() {
    const P = A.post = { code: GR.Online.newCode(), status: 'starting' };
    P.link = new GR.Online(ev => raidPostEvent(P, ev), { priv: true });   // slices are always with strangers: private
    P.link.host(P.code);
  }
  function raidPostStop() {
    const P = A.post;
    A.post = null;
    if (!P) return;
    try { if (P.beacon) P.beacon.stop(); } catch (e) { }
    try { P.link.stop(); } catch (e) { }
  }
  function raidPostEvent(P, ev) {
    if (A.post !== P && A.raidIn !== P) return;
    if (ev.e === 'hosting') { P.status = 'listening'; P.beacon = new GR.Online.Beacon(raidInfo(P.code), { onState: s => { P.listed = s; if (A.screen === 'lobby' && !A.net) render(); } }).begin(); render(); }
    else if (ev.e === 'connected') { P.status = 'connected'; if (P.beacon) { P.beacon.stop(); P.beacon = null; } }
    else if (ev.e === 'msg') raidPostMsg(P, ev.data);
    else if (ev.e === 'lost' || ev.e === 'error') {
      const was = A.raidIn === P;
      if (was) { clearTimeout(P.timer); clearInterval(P.iv); A.raidIn = null; if (A.sheet && A.sheet.t === 'raidin') A.sheet = null; toast((P.peerName || 'The slicer') + ' gave up the slice'); }
      if (A.post === P) raidPostStop();
      if (ev.e === 'error') A.postRetry = Date.now() + 30000;   // the server is unreachable: try again later
      setTimeout(render, 0);
    }
  }
  // the raid post's room is reused for the next raider: say no, then open a fresh post
  function raidPostRefuse(P, why) {
    try { P.link.send(JSON.stringify({ t: 'bye', why })); } catch (e) { }
    setTimeout(() => { if (A.post === P) raidPostStop(); if (A.raidIn === P) A.raidIn = null; render(); }, 300);
  }
  function raidPostMsg(P, data) {
    if (typeof data !== 'string' || data.length > 40000 || A.raidIn) return;
    let m; try { m = JSON.parse(data); } catch (e) { return; }
    if (!m || m.t !== 'hello') return;
    if (m.v !== NET_V) return raidPostRefuse(P, 'The two phones have different versions of Ghostjack. Update both.');
    if (m.raid !== 1) return raidPostRefuse(P, 'That player is only taking slices right now.');
    P.peerName = nm(m.name, 20) || 'Player'; P.peerId = pid(m.id); P.decks = Array.isArray(m.decks) ? m.decks : null; P.hk = pid(m.hk);
    P.peerUid = str(m.u, 40); P.full = Array.isArray(m.full) ? m.full.filter(id => typeof id === 'string' && db[id]).slice(0, 400) : [];
    const st = raidSt();
    if (!P.peerId || isBlocked(P.peerId) || P.peerId === myId()) return raidPostRefuse(P, 'That player isn\'t taking slices right now.');
    if (!RD.open(st) || A.net) return raidPostRefuse(P, P.peerName ? netName() + ' isn\'t taking slices right now.' : 'Not now.');
    const last = (st.raidedBy || {})[P.peerId];
    if (last && Date.now() - last < RD.R.AGAIN_MS) return raidPostRefuse(P, 'You sliced ' + netName() + ' in the last hour.');
    // ask the player (a minute), and tell the raider to wait
    A.raidIn = P; A.post = null;
    P.deadline = Date.now() + RD.R.ANSWER_MS;
    try { P.link.send(JSON.stringify({ t: 'raidwait', s: Math.round(RD.R.ANSWER_MS / 1000), w: RD.wanted(st) ? 1 : 0 })); } catch (e) { }
    P.timer = setTimeout(() => { if (A.raidIn === P) { if (RD.wanted(raidSt())) raidAccept(true); else raidDecline(); } }, RD.R.ANSWER_MS);
    P.iv = setInterval(() => { if (A.raidIn !== P) return clearInterval(P.iv); if (A.sheet && A.sheet.t === 'raidin') { const e = document.querySelector('.rcount'); if (e) e.textContent = raidSecs(); } }, 1000);
    notify('⚠ ' + P.peerName + ' is slicing you!', RD.wanted(st) ? 'Defend your hot card, or the CPU defends for you.' : 'Open Ghostjack within a minute to defend.', 'raid');
    A.sheet = { t: 'raidin' };
    render();
    sliceAlarm(P.peerName);
  }
  const raidSecs = () => { const P = A.raidIn; const s = P ? Math.max(0, Math.ceil((P.deadline - Date.now()) / 1000)) : 0; return '0:' + (s < 10 ? '0' : '') + s; };
  function raidInSheet() {
    const P = A.raidIn;
    if (!P) return '';
    const st = raidSt(), w = RD.wanted(st), hot = w && db[st.hot.id] ? db[st.hot.id].name : '';
    return '<div class="raidin"><div class="rtop">⚠ SLICE</div><h2>' + esc(P.peerName) + ' is slicing you</h2>' +
      '<div class="ptext">They play the Runner; you defend as the <b style="color:var(--corp)">Corp</b> with your ' + esc(deckAt(0, activeIdx(0)).name) + '. ' +
      'You get one turn with +3 credits, then they get one. If they break into HQ, R&amp;D or a remote server, they win.</div>' +
      (w ? '<div class="rstake">You\'re <b>Wanted</b>: if they win, your hot <b>' + esc(hot) + '</b> goes to them. If you don\'t answer, the CPU defends for you.</div>'
        : '<div class="rstake">If they win, they take a copy of one of your cards and you\'re <b>Sliced</b>. Hold them off for +' + RD.R.HOLD_WP + ' Chips.</div>') +
      '<div class="rclock"><span class="rcount">' + raidSecs() + '</span> to answer</div>' +
      '<button class="big" style="width:100%" data-k="rdef">DEFEND</button>' +
      (w ? '<button class="ghost" style="width:100%;margin-top:8px" data-k="rcpu">LET THE CPU DEFEND</button>'
        : '<button class="ghost" style="width:100%;margin-top:8px" data-k="rno">NOT NOW</button>') + '</div>';
  }
  function raidDecline() {
    const P = A.raidIn;
    if (!P) return;
    clearTimeout(P.timer); clearInterval(P.iv);
    if (A.sheet && A.sheet.t === 'raidin') A.sheet = null;
    raidPostRefuse(P, netName() + ' didn\'t take the slice.');
    A.raidIn = P;   // cleared by raidPostRefuse
  }
  function raidAccept(cpu) {
    const P = A.raidIn;
    if (!P) return;
    clearTimeout(P.timer); clearInterval(P.iv);
    A.raidIn = null;
    if (A.sheet && A.sheet.t === 'raidin') A.sheet = null;
    clearTimeout(A.tick);
    if (A.tut) A.tut = null;
    const st = raidSt(), hot = RD.wanted(st) ? st.hot.id : '';
    st.raidedBy = st.raidedBy || {}; st.raidedBy[P.peerId] = Date.now();
    for (const k of Object.keys(st.raidedBy)) if (Date.now() - st.raidedBy[k] > RD.R.AGAIN_MS) delete st.raidedBy[k];
    raidSave(st);
    A.net = { host: true, status: 'connected', link: P.link, online: true, code: P.code, pub: false, chat: [], unread: 0, found: [],
      peerName: P.peerName, peerId: P.peerId, peerUid: P.peerUid, decks: P.decks,
      raid: { role: 'def', them: { n: P.peerName, i: P.peerId }, hot, offer: RD.offer(coll(), db, hot, Math.random, P.full), cpu: !!cpu } };
    P.link.on = ev => netEvent(ev);
    A.net.priv = true;
    startNetGame();
  }
  // the raider: hello carries {raid: 1} and who hacked them (for the revenge bonus)
  function startRaid(x) {
    const st = raidSt(), why = RD.canRaid(st, pid(x.i));
    if (why) { toast(why); return; }
    if (A.games.h) A.games.h.stop(); A.games.scanning = false;
    startOnline(false, x.c, true);
    A.net.raid = { role: 'att', them: { n: nm(x.n, 20) || 'Player', i: pid(x.i) }, hot: x.w && db[x.w.c] ? x.w.c : '' };
    render();
  }
  // a raid game ended: apply it here (each phone does its own side)
  function raidResult(g) {
    const N = A.net, R = N.raid, st = raidSt(), c = coll(), now = Date.now();
    const info = { now, me: { n: netName(), i: myId() }, them: R.them, hot: R.hot };
    let res;
    if (R.role === 'att') {
      if (g.winner === 1) {
        if (R.hot) { res = RD.raiderWins(st, c, info, '', db); res.won = true; }
        else { const can = RD.takeable(R.offer || [], c, M.RULES.MAX); A.loot = { can, info, to: N.peerUid || '' }; store.set('lootPick', A.loot); res = { won: true, pick: true }; if (!can.length) { lootTake(''); res = A.raidRes; } }
      } else res = RD.raiderLoses(st, info);

  async function pubPoll() {

    try {
      const first = !A.pub.last, l = await SO.chatSince(first ? Date.now() - 3600e3 : A.pub.last, first);
      let added = false;
      for (const m of l) {
        if (A.pub.lines.some(x => x.id === m.uid)) continue;   // m.uid is the line's own id here
        const text = FL.mask(String(m.text || '').replace(/\s+/g, ' ').trim().slice(0, 200));
        if (!text) continue;
        A.pub.lines.push({ id: m.uid, a: str(m.u, 40), n: nm(m.name, 20) || 'Player', i: pid(m.pid), m: text, at: +m.at || 0 });
        added = true;
      }
      if (l.length) A.pub.last = Math.max(A.pub.last, ...l.map(m => +m.at || 0));
      else if (first) A.pub.last = Date.now() - 3600e3;
      if (A.pub.lines.length > 120) A.pub.lines.splice(0, A.pub.lines.length - 120);
      A.pub.err = '';

  async function pubSend() {

  // ------------------------------------------------------------ trading cards with friends (social.js trades)
  // Your cards leave your collection when you send an offer (held in 'escrow') and come back if it's declined
  // or cancelled. When your friend accepts, they swap on their phone at once, and on yours at the next check-in.
  const TRADE_MAX = 6;
  const escrow = () => store.get('escrow', {});
  const colStr = () => { const c = coll(); return Object.keys(c).filter(id => c[id] > 0).map(id => id + ':' + c[id]).join(',').slice(0, 4000); };
  const colParse = s => { const o = {}; for (const p of String(s || '').split(',')) { const [id, n] = p.split(':'); if (db[id] && +n > 0) o[id] = Math.min(+n, 9); } return o; };
  const ids = s => String(s || '').split(',').filter(id => db[id]).slice(0, TRADE_MAX);
  const bag = o => { const l = []; for (const id in o) for (let i = 0; i < o[id]; i++) l.push(id); return l; };
  const takeCards = (c, list) => { for (const id of list) { if (c[id] > 0) { c[id]--; if (!c[id]) delete c[id]; } } };
  const hotId = () => { const st = raidSt(); return RD.wanted(st) ? st.hot.id : ''; };
  // how many of a card you can give: owned, minus the hot copy
  const canGive = id => (coll()[id] || 0) - (hotId() === id ? 1 : 0);
  async function openTrade(uid) {
    const f = friends()[uid]; if (!f) return;
    A.tr = { uid, name: f.n, give: {}, get: {}, view: 'mine', side: A.side, their: null, from: A.screen === 'game' && A.g ? 'game' : 'lobby' };

    if (A.screen === 'trade') render();
  }
  function trTiles(list, from) {
    return list.map(id => '<div class="pc">' + tile(id, { k: 'trx:' + from + ':' + id }) + rarDot(id) + '</div>').join('');
  }
  function renderTrade() {
    applyLook(sideCls(A.side));
    const T = A.tr; if (!T) { A.screen = 'lobby'; return render(); }
    const mine = coll(), their = T.their, giveN = bag(T.give).length, getN = bag(T.get).length;
    const src = T.view === 'mine' ? mine : (their || {});
    const pick = T.view === 'mine' ? T.give : T.get;
    const list = Object.keys(src).filter(id => db[id] && db[id].side === (T.side ? 'R' : 'C')).sort((a, b) => db[a].type.localeCompare(db[b].type) || db[a].name.localeCompare(db[b].name));
    const decks = {}; for (const s2 of [0, 1]) for (const d of deckList(s2)) for (const id in d.cards) decks[id] = 1;
    const grid = list.map(id => {

  // ---- the lists of open games and slice targets. They come from the Firebase lobby (lobby/{uid}, kept fresh by
  // lobbyPublish); the older signalling-server scan still runs and its answers are merged in.
  A.fbList = [];
  function listings() {
    const out = {}, put = x => { if (x && typeof x.c === 'string' && /^[A-Z0-9]{5}$/.test(x.c)) out[x.c] = x; };
    for (const x of (A.games.list || [])) put(x);
    for (const x of A.fbList) put(x);
    return Object.keys(out).map(k => out[k]).sort((a, b) => (a.t || 0) - (b.t || 0));
  }
  async function lobbyFetch() {
    if (!socOn()) return;
    try {
      const l = await SO.lobbyList(Date.now()), out = [];
      for (const d of l) {
        const base = { v: d.v, b: d.b, n: d.name, i: d.pid, t: d.seen };
        if (d.raid) out.push(Object.assign({}, base, { c: d.raid, r: 1, s: 0, d: d.deck, w: d.w && db[d.w] ? { c: d.w, u: d.wu } : 0, h: d.h }));
        if (d.game) out.push(Object.assign({}, base, { c: d.game, s: d.side, d: d.deck }));
      }
      A.fbList = out;
    } catch (e) { console.warn('lobby', e); }
    if (A.screen === 'lobby' && !A.net) render();
  }
  // what this phone has open for others: its slice post, and a public game it's hosting
  async function lobbyPublish(beat) {
    if (!socOn()) return;
    const st = raidSt(), P = A.post, N = A.net;
    const raid = P && P.status === 'listening' && P.code ? P.code : '';
    const game = N && N.host && N.online && N.pub && N.status === 'hosting' && N.code ? N.code : '';
    const w = RD.wanted(st) ? st.hot : null;
    const rec = { name: netName(), pid: myId(), v: NET_V, b: String(BUILD).slice(0, 12), raid, game, side: game ? A.side : 0,
      deck: (game ? deckAt(A.side, activeIdx(A.side)) : deckAt(0, activeIdx(0))).name.slice(0, 30), w: w ? w.id : '', wu: w ? w.until : 0, h: st.hacked ? 1 : 0 };
    const key = JSON.stringify(rec);
    if (!raid && !game) { if (A.lobbyKey) { A.lobbyKey = ''; try { await SO.lobbyDel(); } catch (e) { } } return; }
    if (key === A.lobbyKey && !beat) return;
    A.lobbyKey = key;
    try { await SO.lobbyPut(rec); A.lobbyOk = { raid, game }; if (A.screen === 'lobby') render(); } catch (e) { A.lobbyKey = ''; A.lobbyOk = null; console.warn('lobby put', e); }
  }
  function scanGames() {
    lobbyFetch();
    if (!onlineOk() || !GR.Online.scan || !window.GR_BEACON_SCAN) return;   // lists come from Firebase; the old 24-socket PeerJS scan is off (it never reached the real server)
    const G = A.games;
    if (G.h) G.h.stop();
    G.scanning = true; G.err = '';
    G.h = GR.Online.scan((list, done, err) => {
      G.list = list;
      if (done) { G.scanning = false; G.err = err || ''; G.h = null; }
      if (A.screen === 'lobby' && !A.net) render();
    });
  }

  function gotChat(m) {
    const N = A.net;
    if (!N || chatMuted() || N.blockedNow || isBlocked(N.peerId)) return;
    if (!rateOk(N)) return;
    const text = FL.mask(String(m.m == null ? '' : m.m).replace(/\s+/g, ' ').trim().slice(0, 200));
    if (!text) return;
    N.chat = N.chat || [];
    N.chat.push({ me: false, m: text });
    if (N.chat.length > 100) N.chat.shift();
    if (A.sheet && A.sheet.t === 'chat') { chatRefresh(); sfx('GR_SND_click', VOLS[A.set.snd] * 0.6); return; }

  // at most 6 messages in any 8 seconds from the other player; the rest are dropped
  function rateOk(N) { const now = Date.now(); N.chatTimes = (N.chatTimes || []).filter(t => now - t < 8000); if (N.chatTimes.length >= 6) return false; N.chatTimes.push(now); return true; }
  function sendChat(text) {
    const N = A.net;
    text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 200);

    if (N.chat.length > 100) N.chat.shift();
    chatRefresh();
  }

  // ------------------------------------------------------------ training (lessons in tutor.js)
  const LESSONS = GR.Tutor.LESSONS;
  function trainDone() { return store.get('tut', {}); }
  function trainSummary() {

      '<button class="pri" data-k="tlesson:' + l.id + '">' + (d[l.id] ? '✓ ' : (i + 1) + '. ') + esc(l.title) + '<small>' + esc(l.blurb) + '</small></button>').join('') + '</div>';

  function startLesson(id) {
    clearTimeout(A.tick);
    const T = new GR.Tutor.Session(db, id);
    A.tut = T; A.me = T.me; A.g = T.g; hook(A.g);
    A.cpu = T.opp; A.prev = null; A.tutMin = false;

  }
  function leaveTraining(toMenu) {
    clearTimeout(A.tick); A.tut = null; A.screen = 'home'; A.sheet = toMenu ? { t: 'train' } : null;
    music(); layers(); render();
  }
  function nextLesson(L) { const same = LESSONS.filter(l => l.side === L.side); const i = same.indexOf(L); return same[i + 1] || null; }
  // keys that only look at things, never change the game
  const TUT_FREE = ['close', 'hide', 'decide', 'peek', 'pback', 'ident', 'log', 'scores', 'arch', 'menu', 'look', 'cog', 'home', 'speed', 'rules',
    'tnext', 'texit', 'tquit', 'tmin', 'train', 'tlesson', 'hand', 'inst'];
  function tutAllows(k) {
    const T = A.tut;
    if (!T || A.screen !== 'game') return true;
    if (TUT_FREE.indexOf(k.split(':')[0]) >= 0) return true;
    const keys = T.keys();
    if (keys.indexOf(k) >= 0) return true;
    if (k === 'end2' && keys.indexOf('end') >= 0) return true;
    return false;
  }
  // the coach panel and the glowing buttons, refreshed after every render. The panel is only rebuilt when its
  // content changes, and only fades in when the step changes, so CPU moves don't make it flash
  function tutDecorate() {
    let old = document.getElementById('coach');
    for (const e of document.querySelectorAll('.tut-hi')) e.classList.remove('tut-hi');
    const T = A.tut, on = !!(T && A.screen === 'game');
    document.body.classList.toggle('tut', on);
    if (!on || !T.step) { if (old) old.remove(); return; }
    const L = T.L, st = T.step, n = L.steps.length;
    const stepKey = L.id + '|' + T.i, key = stepKey + '|' + (T.canNext ? 1 : 0) + '|' + (A.tutMin ? 1 : 0);
    if (!old || old.dataset.key !== key) {
      const same = LESSONS.filter(l => l.side === L.side);
      let btns = '';
      if (T.canNext) btns = '<button data-k="tnext">NEXT ▸</button>';
      if (st.end) { const nx = nextLesson(L); btns = '<button class="ghost" data-k="train">LESSONS</button>' + (nx ? '<button data-k="tlesson:' + nx.id + '">NEXT LESSON ▸</button>' : ''); }
      const el = document.createElement('div');
      el.id = 'coach';
      el.dataset.key = key; el.dataset.step = stepKey;
      el.className = 'coach' + (A.tutMin && !T.canNext && !st.end ? ' min' : '') + (st.end ? ' done' : '') + (old && old.dataset.step === stepKey ? ' still' : '');
      el.innerHTML = '<div class="ch"><span>' + (L.side ? 'RUNNER' : 'CORP') + ' ' + (same.indexOf(L) + 1) + '/' + same.length + ' · ' + esc(L.title.toUpperCase()) + '</span>' +
        '<span class="pg">' + Math.min(T.i + 1, n) + '/' + n + '</span><button data-k="tmin" aria-label="shrink">' + (A.tutMin ? '▾' : '▴') + '</button><button data-k="texit" aria-label="leave">✕</button></div>' +
        '<div class="cb">' + st.say + '</div>' + (btns ? '<div class="ca">' + btns + '</div>' : '');
      if (old) old.replaceWith(el); else document.body.appendChild(el);
    }
    const keys = T.keys();
    if (keys.indexOf('end') >= 0) keys.push('end2');
    // the glow keeps its rhythm across redraws instead of restarting each time
    const phase = '-' + (Date.now() % 1100) + 'ms';
    const glow = e => { e.classList.add('tut-hi'); e.style.animationDelay = phase; };
    for (const e of document.querySelectorAll('[data-k]')) if (keys.indexOf(e.dataset.k) >= 0 && !e.closest('#coach')) glow(e);
    for (const sel of (st.hi || [])) for (const e of document.querySelectorAll(sel)) glow(e);
  }

  function newGame() {
    store.set('save', null);
    A.me = A.side;
    A.g = new GR.Game({ db, corp: A.me === 0 ? playDeck(0) : STARTER[0], runner: A.me === 1 ? playDeck(1) : STARTER[1], seed: (Date.now() ^ (Math.random() * 1e9)) >>> 0 });
    hook(A.g);
    A.cpu = new GR.CPU(A.g, 1 - A.me, A.level, (Math.random() * 1e9) >>> 0);
    A.screen = 'game'; A.sheet = null; A.hidePrompt = false; A.lastPid = 0;
    A.g.start();
    afterChange();
  }

  function resume() {
    const s = store.get('save', null);
    if (!s) return;
    A.me = s.me; A.level = s.level;
    A.g = new GR.Game({ db, corp: STARTER[0], runner: STARTER[1], seed: 1 });
    A.g.load(s.game);
    hook(A.g);
    A.prev = { g: A.g, s: snap() };
    A.cpu = new GR.CPU(A.g, 1 - A.me, A.level, (Math.random() * 1e9) >>> 0);
    A.screen = 'game'; A.sheet = null; A.hidePrompt = false; A.lastPid = 0;
    afterChange();
  }

  function hook(g) {
    g.on(ev => {
      if (ev.t === 'note' && ev.side === A.me && ev.m.indexOf('Installed ') !== 0) toast(ev.m);
      else if (ev.t === 'damage') fx('damage', '', '', 60);
      else if (ev.t === 'steal') fx('steal');
      else if (ev.t === 'score') fx('score');
      else if (ev.t === 'tag') fx('tag', '', '', 25);
    });
  }
