<title>Ghostjack</title>
<style>:root {
  --bg: #04060d; --panel: #0a1020; --panel2: #0f1830; --line: #2a3d6a; --ink: #f4f8ff; --dim: #9fb4e0;
  --corp: #22d8ff; --runner: #ff2e88; --gold: #ffc61a; --green: #2bff8f; --red: #ff2d55;
  --barrier: #ffae2b; --codegate: #3c9dff; --sentry: #ff4664; --ai: #e8ecff;
  --agenda: #45f5b4; --asset: #b47bff; --upgrade: #2ee6e6; --operation: #ffd34d;
  --program: #57ff8a; --hardware: #ff8a3d; --resource: #ff5fd2; --event: #ffe45c;
  --me: var(--corp); --them: var(--runner);
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
body.side-r { --me: var(--runner); --them: var(--corp); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { background:
  radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--me) 18%, transparent), transparent 60%),
  linear-gradient(180deg, #070b16, #04060c); background-attachment: fixed; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
button { font: inherit; color: inherit; cursor: pointer; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- home ---------- */
.home { padding: calc(28px + var(--safe-t)) 20px 30px; display: flex; flex-direction: column; gap: 18px; }
.logo { font: 800 40px/1 var(--mono); letter-spacing: .12em; text-align: center; margin-top: 10px;
  background: linear-gradient(90deg, var(--corp), #fff 50%, var(--runner)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 12px rgba(80,180,255,.35)); }
.tag { text-align: center; color: var(--dim); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-top: -8px; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.group h3 { margin: 0 0 10px; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { padding: 14px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); text-align: center; }
.seg button b { display: block; font: 700 16px var(--mono); letter-spacing: .06em; }
.seg button small { color: var(--dim); font-size: 12px; }
.seg button.on { border-color: var(--c, var(--gold)); box-shadow: 0 0 0 1px var(--c, var(--gold)) inset, 0 0 18px -6px var(--c, var(--gold)); }
.big { padding: 16px; border-radius: 12px; border: 0; font: 800 17px var(--mono); letter-spacing: .12em; color: #05070d;
  background: linear-gradient(90deg, var(--corp), var(--runner)); box-shadow: 0 6px 24px -8px rgba(255,61,139,.6); }
.ghost { padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 600; }
.stats { display: flex; justify-content: space-around; text-align: center; font-family: var(--mono); }
.stats b { display: block; font-size: 22px; }
.stats span { font-size: 11px; color: var(--dim); letter-spacing: .1em; }

/* ---------- game ---------- */
.game { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding-top: var(--safe-t); }
.top { position: sticky; top: 0; z-index: 10; background: rgba(3,5,12,.94); box-shadow: 0 6px 20px -6px #000; backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 6px 10px 6px; }
.scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font: 700 12px var(--mono); }
.sbar { display: flex; gap: 3px; align-items: center; }
.sbar i { flex: 1; height: 6px; border-radius: 2px; background: #1a2238; }
.sbar.c i.f { background: var(--corp); box-shadow: 0 0 6px var(--corp); }
.sbar.r i.f { background: var(--runner); box-shadow: 0 0 6px var(--runner); }
.sbar.r { flex-direction: row-reverse; }
.scores .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink); margin-bottom: 3px; }
.turnno { color: var(--dim); font-size: 11px; text-align: center; }
.opp { display: flex; gap: 10px; flex-wrap: wrap; font: 500 12px var(--mono); color: var(--dim); margin-top: 5px; }
.opp .gback { flex: none; width: 30px; height: 24px; margin: -2px 0; padding: 0; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 700 14px var(--mono); }
.opp .oppn { flex: 1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; min-width: 0; }
.opp b { color: var(--ink); }
.opp .warn { color: var(--red); }

.banner { margin: 8px 10px 0; padding: 8px 12px; border-radius: 10px; font: 800 13px var(--mono); letter-spacing: .1em;
  display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); background: rgba(5,8,18,.88); }
.banner.mine { border-color: var(--me); color: var(--me); text-shadow: 0 0 10px color-mix(in srgb, var(--me) 70%, transparent);
  background: linear-gradient(90deg, color-mix(in srgb, var(--me) 22%, rgba(5,8,18,.9)), rgba(5,8,18,.9) 70%);
  box-shadow: 0 0 22px -6px var(--me), inset 0 0 0 1px color-mix(in srgb, var(--me) 35%, transparent); }
.banner.run { border-color: var(--red); color: #fff; background: linear-gradient(90deg, rgba(255,59,92,.35), rgba(255,59,92,.08)); }
.banner.decide { border-color: var(--gold); color: var(--gold); }
.banner.over { border-color: var(--gold); color: #05070d; background: var(--gold); }
.banner .sub { font: 500 11px var(--mono); letter-spacing: .04em; opacity: .85; }
.ticker { margin: 6px 10px 0; padding: 5px 8px; border-radius: 8px; background: rgba(3,5,12,.72); font: 500 11.5px/1.45 var(--mono); color: var(--dim); min-height: 3em; }
.ticker { display: flex; align-items: flex-start; gap: 8px; }
.ticker .tl { flex: 1; min-width: 0; }
.ticker .tl div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker .tl div:last-child { color: var(--ink); }
.ticker .logbtn { flex: 0 0 auto; align-self: center; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--me); background: rgba(10,16,32,.9); color: var(--me); font: 800 11px var(--mono); letter-spacing: .1em; }

.zone { margin: 8px 0 0; }
.zone h4 { margin: 0 12px 4px; font: 700 10px var(--mono); letter-spacing: .16em; color: var(--ink); text-shadow: 0 1px 3px #000, 0 0 8px #000; text-transform: uppercase; display: flex; justify-content: space-between; }
.servers { display: flex; gap: 8px; overflow-x: auto; padding: 2px 12px 8px; scroll-snap-type: x proximity; scrollbar-width: none; }
.servers::-webkit-scrollbar { display: none; }
.srv { flex: 0 0 auto; min-width: 74px; display: flex; flex-direction: column; align-items: center; gap: 4px; scroll-snap-align: start; }
.srv .head { width: 100%; padding: 5px 4px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--corp) 45%, var(--line)); background: rgba(8,14,30,.92); box-shadow: 0 4px 14px -4px #000; font: 700 11px var(--mono); text-align: center; letter-spacing: .04em; }
.srv .head small { display: block; font-weight: 600; color: var(--dim); font-size: 10px; }
.srv .head.can { border-color: var(--runner); color: var(--runner); box-shadow: 0 0 12px -4px var(--runner); }
.srv.hot .head { background: var(--red); color: #fff; border-color: var(--red); }
.srv .stack { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.srv .gap { height: 2px; width: 60%; background: var(--line); border-radius: 2px; margin: 1px 0; }
.rig { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 4px; }
.rig .empty { color: var(--dim); text-shadow: 0 1px 3px #000; font: 12px var(--mono); padding: 6px 0; }

/* cards */
.card { position: relative; width: 66px; height: 90px; border-radius: 7px; padding: 4px 4px 3px; flex: 0 0 auto;
  background: linear-gradient(160deg, #16213d, #070b16 70%); border: 1.5px solid var(--cc, #3a4a72);
  box-shadow: 0 4px 12px -3px #000, 0 0 10px -4px var(--cc, transparent), inset 0 0 14px -6px var(--cc, transparent); display: flex; flex-direction: column; overflow: hidden; text-align: left; color: var(--ink); }
.card .cost { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: #000a; border: 1px solid var(--cc); font: 700 10px/14px var(--mono); text-align: center; color: var(--cc); }
.card .nm { font: 700 9.5px/1.15 system-ui, sans-serif; margin-top: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .ty { margin-top: auto; font: 600 8px var(--mono); letter-spacing: .06em; color: var(--cc); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .glyph { position: absolute; top: 2px; left: 4px; font: 700 11px var(--mono); color: var(--cc); }
.card .badges { position: absolute; bottom: 14px; right: 3px; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.bdg { font: 700 9.5px/13px var(--mono); padding: 0 4px; border-radius: 6px; background: #000c; border: 1px solid; }
.bdg.str { color: #fff; border-color: #fff8; }
.bdg.adv { color: var(--gold); border-color: var(--gold); }
.bdg.cr { color: var(--green); border-color: var(--green); }
.card.down { --cc: #2a3654; background: repeating-linear-gradient(135deg, #0f1628 0 6px, #0b111f 6px 12px); }
.card.down .nm { color: var(--dim); text-align: center; margin-top: 26px; font: 700 9px var(--mono); letter-spacing: .08em; }
.card.mine-down { opacity: .62; border-style: dashed; }
.card.ice { width: 74px; height: 50px; }
.card.ice .nm { margin-top: 0; padding-right: 18px; -webkit-line-clamp: 2; }
.card.ice .badges { bottom: 3px; flex-direction: row; }
.card.ice .ty { margin-top: auto; }
.card.ice.down .nm { margin-top: 12px; padding-right: 0; }
.card.enc { outline: 2px solid var(--red); outline-offset: 1px; animation: pulse 1s infinite; }
.card.mini { width: 58px; height: 62px; }
.card.mini .nm { margin-top: 14px; -webkit-line-clamp: 2; }
.card.lit { box-shadow: 0 0 0 1px var(--cc), 0 0 14px -2px var(--cc); }
.card.dull { opacity: .5; }
.card .need { position: absolute; left: 0; right: 0; bottom: 0; background: #000c; color: var(--red); font: 700 8px/13px var(--mono); text-align: center; }
@keyframes pulse { 50% { outline-color: transparent; } }

.me { margin-top: auto; position: sticky; bottom: 0; z-index: 9; background: linear-gradient(180deg, rgba(3,5,12,.82), rgba(3,5,12,.98) 18%); box-shadow: 0 -8px 24px -8px #000; padding: 10px 0 calc(8px + var(--safe-b)); border-top: 1px solid var(--line); }
.mystats { display: flex; align-items: center; gap: 10px; padding: 0 12px; font: 500 12px var(--mono); color: var(--dim); }
.cred { font: 800 26px/1 var(--mono); color: var(--me); text-shadow: 0 0 12px color-mix(in srgb, var(--me) 55%, transparent); }
.cred small { font-size: 13px; }
.clicks { display: flex; gap: 4px; }
.clicks i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--me); }
.clicks i.on { background: var(--me); box-shadow: 0 0 8px var(--me); }
.mystats .x { margin-left: auto; text-align: right; line-height: 1.3; }
.mystats .x b { color: var(--ink); }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px 6px; scrollbar-width: none; }
.hand::-webkit-scrollbar { display: none; }
.hand .card { width: 72px; height: 100px; }
.btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 2px 12px 0; }
.btns.r6 { grid-template-columns: 1fr 1fr 1fr 1.25fr 1fr 1.25fr; gap: 5px; }
.btns button { padding: 10px 2px; border-radius: 9px; border: 1px solid var(--line); background: linear-gradient(180deg, #16244a, #0b1328); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); font: 700 11px var(--mono); letter-spacing: .03em; }
.btns button:disabled { opacity: .35; }
.btns button.hi { border-color: var(--me); color: var(--me); box-shadow: 0 0 12px -4px var(--me), inset 0 0 10px -4px var(--me); }
.btns button.gold { border-color: var(--gold); color: #05070d; background: var(--gold); }

/* sheets */
.veil { position: fixed; inset: 0; z-index: 30; background: rgba(2,4,10,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.veil.clear { background: transparent; pointer-events: none; }
.veil.clear .sheet { pointer-events: auto; }
.veil.still, .veil.still .sheet { animation: none; }
.sheet { width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + var(--safe-b)); box-shadow: 0 -10px 40px rgba(0,0,0,.6); animation: up .18s ease-out; }
.sheet.decide { border-color: var(--gold); box-shadow: 0 -6px 40px -10px rgba(255,194,61,.45); }
.sheet .ptext { font-size: 14px; margin: 2px 2px 12px; }
.sheet .kicker { font: 700 11px var(--mono); letter-spacing: .14em; color: var(--gold); margin-bottom: 6px; display: flex; justify-content: space-between; }
.sheet .kicker button { background: none; border: 0; color: var(--dim); font: 600 11px var(--mono); letter-spacing: .1em; padding: 0; }
.opts { display: flex; flex-direction: column; gap: 7px; }
.opts.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }
.opts button { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); text-align: left; font-weight: 600; }
.opts.grid button { text-align: center; padding: 11px 0; font-family: var(--mono); }
.opts button.pri { border-color: var(--me); color: var(--me); }
.opts button.warn { border-color: var(--red); color: var(--red); }
.opts button:disabled { opacity: .4; }
.opts button small { display: block; color: var(--dim); font-weight: 500; font-size: 12px; }
.bigcard { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; }
.bigcard .face { flex: 0 0 116px; height: 160px; border-radius: 10px; border: 1.5px solid var(--cc); position: relative; overflow: hidden;
  background: radial-gradient(90% 70% at 50% 35%, color-mix(in srgb, var(--cc) 30%, transparent), transparent 70%), linear-gradient(160deg, #141d33, #070b16);
  display: flex; align-items: center; justify-content: center; font: 800 40px var(--mono); color: var(--cc); text-shadow: 0 0 18px var(--cc); }
.bigcard .face .c { position: absolute; top: 6px; right: 6px; font: 800 14px var(--mono); border: 1px solid; border-radius: 12px; padding: 1px 7px; }
.bigcard .face .s { position: absolute; bottom: 6px; right: 6px; font: 800 13px var(--mono); color: #fff; }
.bigcard .info h2 { margin: 0 0 2px; font-size: 17px; line-height: 1.2; }
.bigcard .info .tl { font: 600 11px var(--mono); color: var(--cc); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.bigcard .info p { margin: 0 0 6px; font-size: 13.5px; }
.bigcard .info .st { font: 12px var(--mono); color: var(--dim); }
.subs { font: 12.5px/1.5 var(--mono); margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; background: #0006; border: 1px solid var(--line); }
.subs .b { text-decoration: line-through; color: var(--dim); }
.log { font: 12.5px/1.55 var(--mono); }
.log div { padding: 2px 0; border-bottom: 1px solid #ffffff08; }
.log .t { color: var(--gold); margin-top: 6px; }
.rules { white-space: pre-wrap; font: 12px/1.5 var(--mono); }
.toast { position: fixed; left: 50%; top: calc(70px + var(--safe-t)); transform: translateX(-50%); z-index: 60; max-width: 90%; padding: 9px 14px; border-radius: 10px;
  background: #1b2440; border: 1px solid var(--gold); color: var(--gold); font: 600 13px system-ui; box-shadow: 0 8px 30px rgba(0,0,0,.5); animation: fade .2s; }
.fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; animation: flash .6s ease-out forwards; }
.fx.damage { background: radial-gradient(circle, transparent 30%, rgba(255,59,92,.55)); }
.fx.steal { background: radial-gradient(circle, rgba(255,61,139,.35), transparent 70%); }
.fx.score { background: radial-gradient(circle, rgba(49,208,255,.35), transparent 70%); }
.fx.tag { background: radial-gradient(circle, transparent 40%, rgba(255,194,61,.45)); }
.fxword { position: fixed; left: 0; right: 0; top: 38%; z-index: 41; text-align: center; pointer-events: none; font: 900 34px var(--mono); letter-spacing: .14em;
  animation: word 1.1s ease-out forwards; text-shadow: 0 0 20px currentColor; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
@keyframes word { 0% { opacity: 0; transform: scale(.7); } 20% { opacity: 1; transform: scale(1.05); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15); } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.end { text-align: center; padding: 8px 0 4px; }
.end h1 { margin: 0; font: 900 34px var(--mono); letter-spacing: .12em; }
.end p { color: var(--dim); margin: 6px 0 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card.ice .glyph { display: none; }

/* ---------- card art ---------- */
.card .art { display: block; flex: 0 0 auto; height: 36px; margin: -4px -4px 3px; background: #000 center / cover no-repeat; border-bottom: 1px solid var(--cc); }
.hand .card .art { height: 44px; }
.card.mini .art { height: 24px; margin-bottom: 2px; }
.card .art + .nm, .card.mini .art + .nm { margin-top: 0; }
.card .glyph, .card .cost { z-index: 2; }
.card .glyph { background: #000a; border-radius: 4px; padding: 0 2px; }
.card.ice .art { position: absolute; inset: 0; height: auto; margin: 0; opacity: .38; border: 0; }
.card.ice .nm, .card.ice .ty, .card.ice .badges { position: relative; z-index: 1; }
.card.ice .badges { position: absolute; }
.card.down.hasback { background: #05070d center / cover no-repeat; }
.card.down.hasback .nm { background: #000b; margin: auto -4px 0; padding: 2px 0; border-top: 1px solid #fff2; }
.card.ice.down.hasback .nm { margin-top: auto; }
.bigcard .face.pic { background: #000 center / cover no-repeat; flex-basis: 150px; height: 150px; border-radius: 10px; }

/* ---------- backdrop ---------- */
#backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
#backdrop .box { position: absolute; }
#backdrop .pic, #backdrop .tw { position: absolute; inset: 0; background-repeat: no-repeat; }
#backdrop .pic { background-size: 100% 100%; filter: saturate(1.45) contrast(1.2) brightness(.85); }
#backdrop .tw { background-size: 400% 400%; mix-blend-mode: screen; }
#backdrop .rain { position: absolute; inset: 0; background-size: 160px 320px; opacity: .45; animation: rain .55s linear infinite; }
#backdrop .rain.storm { opacity: .7; animation-duration: .32s; }
#backdrop .shade { position: absolute; inset: 0; background:
  radial-gradient(130% 75% at 50% 45%, transparent 35%, rgba(2,3,8,.75) 100%),
  linear-gradient(180deg, rgba(2,3,8,.5), rgba(2,3,8,.55) 45%, rgba(2,3,8,.88)); }
@keyframes rain { from { background-position: 0 0; } to { background-position: -30px 320px; } }
body.haspic { background: #04060c; }
#app { position: relative; z-index: 1; }

/* ---------- Amber Terminal ---------- */
body.amber {
  --bg: #0a0600; --panel: #120b01; --panel2: #1a1103; --line: #3d2a08; --ink: #ffd88a; --dim: #a77a30;
  --corp: #ffb000; --runner: #ffd25e; --gold: #ffe7a0; --green: #ffc84a; --red: #ff6b2c;
  --barrier: #ffb000; --codegate: #ffd88a; --sentry: #ff6b2c; --ai: #fff0c8;
  --agenda: #ffe08a; --asset: #e8a33a; --upgrade: #ffc94d; --operation: #ffd25e;
  --program: #ffbf3a; --hardware: #f29a2e; --resource: #ffcf7a; --event: #ffe39a;
  background: radial-gradient(120% 70% at 50% 0%, #1d1100, #070400 70%) fixed;
  font-family: var(--mono);
}
body.amber::after { background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
body.amber .logo { background: none; color: var(--corp); -webkit-background-clip: initial; background-clip: initial; filter: drop-shadow(0 0 10px rgba(255,176,0,.6)); }

body.amber .sheet, body.amber .top { text-shadow: 0 0 6px rgba(255,176,0,.25); }
body.amber.side-r { --me: #ffd25e; }

#fxe .edge.t { top: var(--safe-t); }
#fxe .edge.b { bottom: 0; transform: scaleY(-1); animation-direction: reverse; }
@keyframes scan { from { -webkit-mask-position: 0 0; mask-position: 0 0; } to { -webkit-mask-position: 0 100vh; mask-position: 0 100vh; } }
@keyframes edge { from { -webkit-mask-position: 0 0; mask-position: 0 0; } to { -webkit-mask-position: 512px 0; mask-position: 512px 0; } }
.burst { position: fixed; z-index: 42; pointer-events: none; width: 86vw; max-width: 480px; aspect-ratio: 1; left: 50%; top: 42%;
  transform: translate(-50%, -50%); background-size: 400% 400%; background-repeat: no-repeat; }
.badge { position: fixed; z-index: 43; pointer-events: none; left: 50%; top: 40%; width: 36vw; max-width: 200px; aspect-ratio: 1;
  background: center / contain no-repeat; transform: translate(-50%, -50%); animation: badge 1.2s linear forwards; filter: drop-shadow(0 0 14px rgba(0,0,0,.6)); }
@keyframes badge {
  0% { transform: translate(-50%, -50%) scale(.6); opacity: .6; } 8% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  16% { transform: translate(-50%, -50%) scale(1.04); } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } }

/* the full framed card when a card is tapped */
.bigframed { margin: 0 0 10px; text-align: center; }
.bigframed img { display: block; margin: 0 auto; width: min(86vw, 340px); aspect-ratio: 1; border-radius: 12px; box-shadow: 0 10px 40px -10px var(--cc, #000); }
.bigframed.sm img { width: min(62vw, 230px); }
.bigframed .st { font: 12px var(--mono); color: var(--dim); margin-top: 6px; }

/* ---------- landscape (a phone turned sideways) ----------
   top: score strip across the screen; left: the board (rig + servers), scrolling; right: banner, log line, credits, hand, buttons */
@media (orientation: landscape) and (max-height: 600px) {
  #app { max-width: none; }
  .home { max-width: 640px; margin: 0 auto; padding-top: calc(14px + var(--safe-t)); }
  .game { display: grid; height: 100vh; height: 100dvh; min-height: 0;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 40%); grid-template-rows: auto auto auto minmax(0, 1fr);
    grid-template-areas: "top top" "board banner" "board ticker" "board me";
    padding-left: var(--safe-l); padding-right: var(--safe-r); }
  .top { grid-area: top; position: static; padding: 4px 12px; }
  .top .scores { grid-template-columns: 1fr auto 1fr; }
  .opp { margin-top: 2px; }
  .banner { grid-area: banner; margin: 6px 10px 0 6px; padding: 6px 10px; }
  .ticker { grid-area: ticker; margin: 5px 10px 0 6px; min-height: 0; padding: 3px 8px; }
  .ticker .tl div:not(:last-child) { display: none; }
  .ticker .logbtn { padding: 3px 8px; }
  .board { grid-area: board; overflow-y: auto; overscroll-behavior: contain; padding: 2px 0 10px; scrollbar-width: none;
    border-right: 1px solid var(--line); background: linear-gradient(90deg, transparent, rgba(3,5,12,.35)); }
  .board::-webkit-scrollbar { display: none; }
  .zone { margin-top: 6px; }
  .me { grid-area: me; position: static; margin: 6px 0 0; display: flex; flex-direction: column; min-height: 0;
    padding: 6px 0 calc(6px + var(--safe-b)); background: rgba(3,5,12,.9); border-top: 1px solid var(--line); box-shadow: none; }
  .mystats { padding: 0 10px; }
  .cred { font-size: 22px; }
  .hand { padding: 6px 10px 4px; flex: 0 0 auto; }
  .hand .card { width: 66px; height: 92px; }
  .btns { grid-template-columns: repeat(3, 1fr) !important; padding: 2px 10px 0; gap: 5px; margin-top: auto; }
  .btns button { padding: 8px 2px; }
  /* panels open as a centred window instead of sliding up from the bottom */
  .veil { align-items: center; }
  .sheet { max-width: 620px; max-height: 92vh; border-radius: 16px; border-bottom: 1px solid var(--line);
    padding: 12px 14px; margin: 0 calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l)); }
  .bigframed img { width: min(58vh, 300px); }
  .bigframed.sm img { width: min(46vh, 220px); }
  .veil.clear .sheet .bigframed.sm { float: left; margin: 0 12px 6px 0; }
  .veil.clear .sheet .bigframed.sm img { width: min(40vh, 160px); }
  .veil.clear .sheet .subs, .veil.clear .sheet .ptext { overflow: hidden; }
  .veil.clear .sheet .opts { clear: both; }
  #fxe .edge.t { top: 0; }
}

/* ---------- training ---------- */
.home .train { width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--gold);
  background: linear-gradient(120deg, rgba(255,198,26,.16), rgba(10,16,32,.9) 60%); color: var(--ink); box-shadow: 0 0 18px -8px var(--gold); }
.home .train b { display: block; font: 800 15px var(--mono); letter-spacing: .12em; color: var(--gold); }
.home .train small { color: var(--dim); font-size: 12px; }
.tg { margin: 12px 0 6px; font: 800 11px var(--mono); letter-spacing: .16em; }
.coach { position: fixed; z-index: 55; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 6px); width: min(94vw, 520px);
  background: linear-gradient(160deg, #10203f, #060b18 75%); border: 1.5px solid var(--gold); border-radius: 12px;
  box-shadow: 0 10px 30px -6px #000, 0 0 20px -8px var(--gold); padding: 7px 10px 9px; font: 14px/1.42 system-ui, sans-serif; color: var(--ink); animation: fade .2s; }
.coach .ch { display: flex; gap: 4px; align-items: center; font: 700 10px var(--mono); letter-spacing: .1em; color: var(--gold); }
.coach .ch span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coach .ch .pg { color: var(--dim); margin-right: 4px; }
.coach .ch button { background: none; border: 0; color: var(--dim); font: 700 15px var(--mono); padding: 2px 7px; }
.coach .cb { margin-top: 4px; }
.coach .cb b { color: var(--gold); }
.coach .cb i { color: var(--dim); }
.coach .ca { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
.coach .ca button { padding: 9px 14px; border-radius: 9px; border: 1px solid var(--gold); background: rgba(255,198,26,.14); color: var(--gold); font: 800 12px var(--mono); letter-spacing: .08em; }
.coach .ca button.ghost { border-color: var(--line); background: transparent; color: var(--dim); }
.coach.min .cb, .coach.min .ca { display: none; }
.coach.still { animation: none; }
.coach.done { border-color: var(--green); box-shadow: 0 10px 30px -6px #000, 0 0 24px -6px var(--green); }
.tut-hi { outline: 2.5px solid var(--gold) !important; outline-offset: 2px; animation: tutpulse 1.1s ease-in-out infinite; position: relative; z-index: 5; }
@keyframes tutpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,198,26,.7); } 50% { box-shadow: 0 0 0 8px rgba(255,198,26,0); } }
body.tut .toast { top: auto; bottom: calc(46% + var(--safe-b)); }
body.tut .veil .sheet { max-height: 64vh; }
body.tut .bigframed img { width: min(56vw, 230px); }
body.tut .bigframed.sm img { width: min(44vw, 180px); }
@media (orientation: landscape) and (max-height: 600px) {
  /* the coach sits over the top of the right-hand column (score strip, banner, log line); panels open on the left */
  .coach { left: auto; right: calc(var(--safe-r) + 6px); transform: none; top: calc(var(--safe-t) + 4px); width: calc(40% - 12px); min-width: 288px;
    max-height: 46vh; overflow-y: auto; font-size: 13px; padding: 6px 9px 8px; }
  .coach .ca { margin-top: 5px; }
  .coach .ca button { padding: 7px 12px; }
  body.tut .veil { justify-content: flex-start; }
  body.tut .veil .sheet { width: 58vw; max-width: 58vw; max-height: 94vh; margin: 0 0 0 calc(8px + var(--safe-l)); }
  body.tut .me { padding-top: 4px; }
  body.tut .bigframed img { width: min(50vh, 210px); }
  body.tut .veil.clear .sheet .bigframed.sm img { width: min(40vh, 160px); }
}

/* ---------- library, decks, shop ---------- */
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.row3 button { padding: 11px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: center; }
.row3 button b { display: block; font: 800 13px var(--mono); letter-spacing: .1em; }
.row3 button small { color: var(--dim); font-size: 11px; }
.row3 .shopb { border-color: var(--gold); box-shadow: 0 0 14px -8px var(--gold); }
.row3 .shopb small { color: var(--gold); }
.deckline { margin-top: 10px; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.deckline b { color: var(--ink); }
.deckline button { margin-left: auto; background: none; border: 0; color: var(--me); font: 700 12px var(--mono); padding: 4px 0; }
.page { padding: calc(8px + var(--safe-t)) 12px calc(24px + var(--safe-b)); max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.page > * { min-width: 0; max-width: 100%; }
.page { width: 100%; box-sizing: border-box; overflow-x: hidden; }
.phead { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 10px; padding: 8px 0; background: linear-gradient(180deg, var(--bg) 70%, transparent); }
.phead h2 { margin: 0; flex: 1; font: 800 18px var(--mono); letter-spacing: .16em; }
.phead .back { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: 700 18px var(--mono); }
.wpill { padding: 7px 12px; border-radius: 20px; border: 1px solid var(--gold); background: rgba(255,198,26,.12); color: var(--gold); font: 800 15px var(--mono); }
.wpill small { font-size: 10px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg2 button { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: 800 13px var(--mono); letter-spacing: .12em; color: var(--dim); }
.seg2 button.on { color: var(--c, var(--me)); border-color: var(--c, var(--me)); box-shadow: inset 0 0 0 1px var(--c, var(--me)), 0 0 14px -6px var(--c, var(--me)); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: 0 0 auto; padding: 7px 11px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); font: 600 12px system-ui, sans-serif; color: var(--dim); white-space: nowrap; }
.chips button.on { color: var(--bg); background: var(--me); border-color: var(--me); }
.lbar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--dim); }
.lbar b { color: var(--ink); }
.lbar button { padding: 6px 11px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--dim); }
.lbar button.on { color: var(--bg); background: var(--me); border-color: var(--me); }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px 8px; }
.lt { position: relative; display: flex; flex-direction: column; align-items: center; }
.lt .card { width: 100%; max-width: 92px; height: auto; aspect-ratio: 66 / 90; }
.lt.none .card { opacity: .38; filter: grayscale(.7); }
.lt .own { margin-top: 3px; font: 700 11px var(--mono); color: var(--ink); }
.lt.none .own { color: var(--gold); font-weight: 600; }
.rar { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.rar.rC { background: #8ea1c9; } .rar.rU { background: #3fd0ff; box-shadow: 0 0 6px #3fd0ff; } .rar.rR { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.lt > .rar, .pc > .rar { position: absolute; top: -3px; left: -3px; z-index: 3; border: 1.5px solid var(--bg); }
.empty { color: var(--dim); font: 13px var(--mono); padding: 30px 6px; text-align: center; grid-column: 1 / -1; }
.cinfo { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 13px; color: var(--dim); margin: -2px 0 8px; }
.cinfo b { color: var(--ink); }

}

/* ---- chat */
.ticker .chatbtn { position: relative; font-size: 15px; letter-spacing: 0; padding: 5px 9px; }

.cmute { width: 100%; margin-top: 8px; }

/* ================= title screen ================= */
.title { position: fixed; inset: 0; z-index: 5; overflow: hidden; background: #02040a; cursor: pointer; user-select: none; -webkit-user-select: none; --hz: 60%; }
.tsky { position: absolute; left: 0; right: 0; top: 0; height: var(--hz); background: url(assets/bg/GR_BG_CORE.webp) center 35% / cover;
  opacity: .5; -webkit-mask-image: linear-gradient(#000 30%, transparent 98%); mask-image: linear-gradient(#000 30%, transparent 98%); }
.thz { position: absolute; left: 0; right: 0; top: var(--hz); height: 2px; transform: scaleX(0); opacity: 0;
  background: linear-gradient(90deg, transparent, var(--corp) 22%, #fff 50%, var(--runner) 78%, transparent);
  box-shadow: 0 0 18px 2px rgba(120,160,255,.55), 0 0 60px 8px rgba(255,46,136,.18); }
.tfloor { position: absolute; left: 0; right: 0; top: var(--hz); bottom: 0; overflow: hidden; perspective: 260px; perspective-origin: 50% 0; opacity: 0;
  -webkit-mask-image: linear-gradient(transparent, #000 30%); mask-image: linear-gradient(transparent, #000 30%); }
.tplane { position: absolute; left: -100%; right: -100%; top: 0; height: 250px; transform-origin: 50% 0; transform: rotateX(76deg);
  background-image: linear-gradient(90deg, rgba(34,216,255,.55) 0 2px, transparent 2px), linear-gradient(0deg, rgba(255,46,136,.45) 0 2px, transparent 2px);
  background-size: 48px 48px; background-position: calc(50% + 24px) 0; animation: tfl 1.1s linear infinite; }
@keyframes tfl { to { background-position: calc(50% + 24px) 48px; } }
.tplane i { position: absolute; left: calc(50% + var(--x) * 48px - 1px); width: 4px; height: 46px; top: 100%; border-radius: 2px;
  animation: tpk var(--d) linear var(--w) infinite; }
.tplane i.c { background: linear-gradient(transparent, var(--corp)); box-shadow: 0 0 10px var(--corp); }
.tplane i.r { background: linear-gradient(transparent, var(--runner)); box-shadow: 0 0 10px var(--runner); }
@keyframes tpk { from { top: 100%; } to { top: -20%; } }
.tboot { position: absolute; left: 18px; right: 18px; top: calc(16px + var(--safe-t)); margin: 0; font: 500 11px/1.6 var(--mono); color: rgba(170,195,240,.75);
  white-space: pre-wrap; transition: opacity 1s; text-shadow: 0 0 8px rgba(34,216,255,.35); }
.tmid { position: absolute; left: 0; right: 0; top: calc(var(--hz) - 34%); display: flex; flex-direction: column; align-items: center; gap: 14px; transition: transform .45s cubic-bezier(.6,0,.9,.4), opacity .45s; }
.tmid .glogo { width: min(84vw, 470px); height: auto; overflow: visible; filter: drop-shadow(0 0 6px rgba(120,170,255,.55)); }
.tmid .glogo path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.tsub { font: 600 14px system-ui, sans-serif; letter-spacing: .04em; color: #c9d6f5; opacity: 0; text-shadow: 0 0 12px #000, 0 0 4px #000; }
.tgo { position: absolute; left: 0; right: 0; bottom: calc(76px + var(--safe-b)); text-align: center; font: 800 15px var(--mono); letter-spacing: .3em; text-indent: .3em;
  color: #fff; opacity: 0; text-shadow: 0 0 14px var(--me), 0 0 2px #fff; }
.tfoot { position: absolute; left: 0; right: 0; bottom: calc(18px + var(--safe-b)); text-align: center; font: 11px var(--mono); color: rgba(159,180,224,.55); }

/* the sequence: boot log types, then (.go) the logo draws itself, the horizon ignites, the floor rises, the prompt appears */
.title.go .tboot { opacity: .45; }
.title.go .glogo path { animation: tdraw .6s cubic-bezier(.65,0,.25,1) forwards; animation-delay: calc(var(--i) * 55ms); }
.title.go .glogo { animation: tpower 1.6s ease-out forwards; }
.title.go .thz { animation: thz .7s cubic-bezier(.2,.8,.2,1) .45s forwards; }
.title.go .tfloor { animation: tfade 1s ease-out .6s forwards; }
.title.go .tsub { animation: tfade .8s ease-out .95s forwards; }
.title.go .tgo { animation: tfade .6s ease-out 1.3s forwards, tpulse 2.2s ease-in-out 2s infinite; }
@keyframes tdraw { to { stroke-dashoffset: 0; } }
@keyframes tfade { to { opacity: 1; } }
@keyframes thz { 0% { opacity: 1; transform: scaleX(0); } 100% { opacity: 1; transform: scaleX(1); } }
@keyframes tpulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes tpower {   /* the moment the drawing finishes: a surge, a split-second colour split, then a steady glow */

/* the border line along each cut */

  content: ''; position: absolute; inset: -1px; pointer-events: none; --b: var(--line);
  background: linear-gradient(135deg, transparent calc(var(--ch) * .7071 - .2px), var(--b) 0 calc(var(--ch) * .7071 + 1.3px), transparent 0),

.sidesw button.on::after { --b: var(--c); }

    linear-gradient(-45deg, transparent calc(var(--ch) * .7071 - .2px), var(--b) 0 calc(var(--ch) * .7071 + 1.3px), transparent 0); }

    linear-gradient(-45deg, transparent calc(var(--ch) * .7071 - .2px), var(--b) 0 calc(var(--ch) * .7071 + 1.3px), transparent 0); }

/* ---- SLICER ATTACK */
#slicefx { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ff2d55; background: #05070d; overflow: hidden; animation: sstrobe .4s steps(1) 6; }
#slicefx .sw { position: absolute; inset: -20% -60%; background: linear-gradient(100deg, transparent 38%, #ff2d55 46%, #fff 50%, #ff2d55 54%, transparent 62%); animation: swipe .55s cubic-bezier(.7,0,.3,1) both; pointer-events: none; }
#slicefx .sk { position: relative; width: min(52vw, 260px); filter: drop-shadow(0 0 18px #ff2d55) drop-shadow(0 0 40px #ff2d5588); animation: skin .5s .25s cubic-bezier(.2,1.6,.4,1) both, sglitch 1.2s .8s steps(2) infinite; }

/* 2.5 flashes a second: under the 3-per-second limit */

em.rf { background: var(--me); color: #05070d; }

/* your own background picture: covers the screen, no stretching */

.admtabs { grid-template-columns: repeat(3, 1fr); } .admtabs.own { grid-template-columns: repeat(5, 1fr); } .admtabs button { font-size: 10px; letter-spacing: .04em; }

.notown { padding: 1px 7px; border-radius: 6px; border: 1px solid #ff5a7a; color: #ff7a93; font: 800 11px var(--mono); letter-spacing: .08em; }

.lt .trk, .pc .trk { position: absolute; top: -6px; right: -4px; z-index: 3; color: var(--gold); font-size: 15px; text-shadow: 0 0 6px rgba(255, 190, 60, .8), 0 1px 0 #000; }

/* ---- the GHOSTJACK title tab on an open card: a blue and red strobe scrolling across the name */

  clip-path: polygon(0 0, 100% 0, 93% 100%, 7.3% 100%); mix-blend-mode: screen; opacity: .7;
