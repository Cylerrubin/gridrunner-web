    const lock = A.net && A.net.link && A.net.link.mode === 'relay' ? '<span class="iplock" title="IP addresses hidden">🔒</span>' : '';
    const oppTxt = lock + (me
      ? '<span>' + esc(oppName()) + ' · Corp</span><span><b>' + v.cCred + '</b>¢</span><span>HQ <b>' + v.cHandN + '</b></span><span>R&amp;D <b>' + v.cRDN + '</b></span>' + (v.cBP ? '<span class="warn">BP ' + v.cBP + '</span>' : '')
      : '<span>' + esc(oppName()) + ' · Runner</span><span><b>' + v.rCred + '</b>¢</span><span>Grip <b>' + v.rHandN + '</b></span><span>Stack <b>' + v.rStackN + '</b></span>' + (v.rTags ? '<span class="warn">TAGS ' + v.rTags + '</span>' : '') + (v.rBrain ? '<span class="warn">BRAIN ' + v.rBrain + '</span>' : ''));
    let h = '<div class="game"><div class="top">' +
      '<div class="scores" data-k="scores"><div><div class="lab"><span style="color:var(--corp)">CORP</span><span>' + v.cPts + '/7</span></div>' + bar(v.cPts, 'c') + '</div>' +
      '<div class="turnno">T' + Math.max(1, v.turn) + '<br><button data-k="menu" style="background:none;border:0;color:var(--ink);font:700 16px var(--mono);padding:0 4px">☰</button></div>' +
      '<div><div class="lab"><span>' + v.rPts + '/7</span><span style="color:var(--runner)">RUNNER</span></div>' + bar(v.rPts, 'r') + '</div></div>' +
      '<div class="opp"><button class="gback" data-k="goback" aria-label="back">◂</button><span class="oppn" data-k="ident:' + (me ? v.cIdent : v.rIdent) + '">' + oppTxt + '<span style="margin-left:auto">ⓘ</span></span>' +
      '<button class="gcog" data-k="cog" aria-label="settings">⚙</button>' +
      (socOn() && !A.tut ? '<button class="gsoc" data-k="soc" aria-label="social">👥' + (socBadge() ? '<i>' + Math.min(socBadge(), 9) + '</i>' : '') + '</button>' : '') + '</div></div>';

    h += banner(v);
    const recent = g.log.filter(l => l.indexOf('---') !== 0).slice(A.wide ? -60 : -3);
    h += '<div class="ticker" data-k="log"><div class="tl">' + recent.map(l => '<div>' + (A.wide ? logText(l) : esc(l)) + '</div>').join('') + '</div>' + chatBtn() + '</div>';

    const corpZone = renderServers(v), rigZone = renderRig(v);
    h += '<div class="board">' + (me ? corpZone + rigZone : rigZone + corpZone) + '</div>';

    // my area
    const cred = myCred(v);
    let pips = '';
    const totalClicks = Math.max(g.clicks, g.active === me ? (3 + me) : 0);
    if (g.active === me && g.phase === 2) for (let i = 0; i < Math.max(totalClicks, g.clicks); i++) pips += '<i class="' + (i < g.clicks ? 'on' : '') + '"></i>';
    const x = me
      ? 'Tags <b' + (v.rTags ? ' style="color:var(--red)"' : '') + '>' + v.rTags + '</b> · MU <b>' + v.rMU + '/' + v.rMUmax + '</b><br>Link <b>' + v.rLink + '</b> · Hand <b>' + v.rHandN + '/' + v.rHandMax + '</b>'
      : 'Bad pub <b>' + v.cBP + '</b><br>Hand <b>' + v.cHandN + '/' + v.cHandMax + '</b> · R&amp;D <b>' + v.cRDN + '</b>';
    h += '<div class="me"><div class="mystats"><div class="cred">' + cred + '<small>¢</small></div><div class="clicks">' + pips + '</div><div class="x">' + x + '</div></div>';
    h += '<div class="hand">' + v.hand.map((id, i) => {
      const need = handNeed(v, id);
      const live = canAct() && !need;
      const c = db[id];
      return tile(id, { k: 'hand:' + i, need, cls: live ? 'lit' : (canAct() ? 'dull' : ''), str: c && c.type === 'PROGRAM' && c.str ? c.str : (c && c.type === 'ICE' ? c.str : null) });
    }).join('') + (v.hand.length ? '' : '<div style="color:var(--dim);font:12px var(--mono);padding:30px 4px">No cards in hand</div>') + '</div>';

    const ca = canAct();
    const waitingMe = g.wait === me + 1;
    const endBtn = waitingMe && A.hidePrompt ? '<button class="gold" data-k="decide">DECIDE</button>'
      : '<button data-k="end" ' + (myTurnFree() ? '' : 'disabled') + ' class="' + (myTurnFree() && g.clicks === 0 ? 'hi' : '') + '">END TURN</button>';
    if (me) {
      h += '<div class="btns r6"><button data-k="credit" ' + (ca ? '' : 'disabled') + '>+1¢</button><button data-k="draw" ' + (ca && v.rStackN ? '' : 'disabled') + '>DRAW</button>' +
        '<button data-k="runmenu" ' + (ca ? '' : 'disabled') + ' class="' + (ca ? 'hi' : '') + '">RUN</button>' +
        '<button data-k="untag" ' + (ca && v.rTags && v.rCred >= 2 ? '' : 'disabled') + '>CLEAR TAG</button><button data-k="log">LOG</button>' + endBtn + '</div>';
    } else {
      h += '<div class="btns" style="grid-template-columns:1fr 1fr 1fr 1.4fr"><button data-k="credit" ' + (ca ? '' : 'disabled') + '>+1¢</button><button data-k="draw" ' + (ca ? '' : 'disabled') + '>DRAW</button>' +
        '<button data-k="log">LOG</button>' + endBtn + '</div>';
    }
    h += '</div></div>';
    $app.innerHTML = h;

    // the decision sheet comes up by itself
    if (waitingMe && g.pr && g.pr.pid !== A.lastPid) { A.lastPid = g.pr.pid; A.hidePrompt = false; if (A.sheet && OVER_PROMPT.indexOf(A.sheet.t) < 0) A.sheet = null; }
    renderSheet();
    tutDecorate();
  }

  function banner(v) {
    const g = A.g, me = A.me;
    if (g.phase === 9) return '<div class="banner over"><span>' + (g.winner === me ? 'YOU WIN' : 'YOU LOSE') + '</span><span class="sub">' + esc(g.why) + '</span></div>';
    if (g.phase === 1) return '<div class="banner decide"><span>OPENING HANDS</span><span class="sub">keep or mulligan</span></div>';
    if (g.runOn) {
      const pos = g.runIce.length ? (g.runPos < g.runIce.length ? 'ice ' + (g.runPos + 1) + ' of ' + g.runIce.length : 'past the ice') : 'no ice';
      return '<div class="banner run"><span>RUN · ' + esc(GR.sname(g.runSrv)) + '</span><span class="sub">' + pos + (g.wait === me + 1 ? ' · your call' : '') + '</span></div>';
    }
    if (g.wait === me + 1) return '<div class="banner decide"><span>DECIDE</span><span class="sub">answer the panel</span></div>';
    if (g.active === me) return '<div class="banner mine"><span>YOUR TURN</span><span class="sub">' + g.clicks + ' click' + (g.clicks === 1 ? '' : 's') + ' left</span></div>';
    if (A.net) return '<div class="banner"><span>' + esc(oppName().toUpperCase()) + '\'S TURN</span><span class="sub">' + (g.wait && g.wait !== me + 1 ? 'deciding…' : 'playing…') + '</span></div>';
    return '<div class="banner"><span>CPU\'S TURN</span><span class="sub">' + (A.level ? 'Hard' : 'Easy') + ' · thinking…</span></div>';
  }

  function renderServers(v) {
    const g = A.g, me = A.me;
    const runnable = me === 1 && canAct();
    const cols = ['HQ', 'RD', 'AR'].concat(v.remotes);
    let h = '<div class="zone"><h4><span>Corp servers</span><span data-k="ident:' + v.cIdent + '" style="color:var(--corp)">' + esc(shortName(v.cIdent)) + ' ⓘ</span></h4><div class="servers">';
    for (const loc of cols) {
      let sub = '';
      if (loc === 'HQ') sub = v.cHandN + ' cards';
      else if (loc === 'RD') sub = v.cRDN + ' cards';
      else if (loc === 'AR') sub = v.cArch.length + ' up' + (v.cDownN ? ' · ' + v.cDownN + '↓' : '');
      else sub = 'remote';
      h += '<div class="srv' + (g.runOn && g.runSrv === loc ? ' hot' : '') + '"><button class="head' + (runnable ? ' can' : '') + '" data-k="srv:' + loc + '">' + esc(GR.sname(loc).replace('Server ', 'S')) + '<small>' + sub + '</small></button><div class="stack">';
      for (const x of iceOn(v, loc)) {
        const known = x.card !== '?';
        const c = db[x.card];
        h += tile(x.card, { k: 'inst:' + x.iid, cls: 'ice' + (g.runEnc === x.iid ? ' enc' : ''), down: !known, mineDown: me === 0 && !x.rez, str: known ? c.str : null, adv: x.adv });
      }
      const roots = rootOn(v, loc);
      if (roots.length || loc === 'AR') h += '<div class="gap"></div>';
      if (loc === 'AR' && v.cArch.length) h += tile(v.cArch[v.cArch.length - 1], { k: 'arch', cls: 'mini', cost: false });
      for (const x of roots) {
        const known = x.card !== '?';
        h += tile(x.card, { k: 'inst:' + x.iid, cls: 'mini', down: !known, mineDown: me === 0 && !x.rez, adv: x.adv, host: x.host, cost: me === 0 ? undefined : false });
      }
      h += '</div></div>';
    }
    return h + '</div></div>';
  }

  function renderRig(v) {
    const g = A.g;
    const rig = v.inst.filter(x => x.loc === 'RIG');
    const order = { P: 0, H: 1, S: 2 };
    rig.sort((a, b) => order[a.slot] - order[b.slot]);
    let h = '<div class="zone"><h4><span>Runner rig · heap ' + v.rHeap.length + '</span><span data-k="ident:' + v.rIdent + '" style="color:var(--runner)">' + esc(shortName(v.rIdent)) + ' ⓘ</span></h4><div class="rig">';
    if (!rig.length) h += '<div class="empty">Nothing installed yet</div>';
    for (const x of rig) {
      const c = db[x.card];
      const str = c.type === 'PROGRAM' && brkType(x.card) ? c.str + (g.runBoost[x.iid] || 0) : null;
      h += tile(x.card, { k: 'inst:' + x.iid, cls: 'mini', str, host: x.host, cost: false });
    }
    return h + '</div></div>';
  }

  // ------------------------------------------------------------ sheets
  // these panels open on top of a decision that is waiting for you (it comes back when they close)
  const OVER_PROMPT = ['netwait', 'raidin', 'invite', 'dm', 'soc', 'mem', 'report', 'trade', 'peek', 'menu', 'log', 'confirm', 'netlost', 'fixes', 'look', 'chat', 'block', 'blocked'];
  function renderSheet() {
    const old = document.getElementById('veil');
    const oldKey = old ? old.dataset.key : '', oldTop = old && old.firstChild ? old.firstChild.scrollTop : 0;
    if (old) old.remove();
    let html = '', cls = 'sheet', clear = false, key = '';
    const g = A.g;
    if (A.screen === 'game' && g && g.phase === 9 && !A.sheet && !A.tut) { html = overSheet(); key = 'over'; }
    else if (A.screen === 'game' && g && g.wait === A.me + 1 && g.pr && !A.hidePrompt && !(A.sheet && OVER_PROMPT.indexOf(A.sheet.t) >= 0)) {
      html = promptSheet(); cls += ' decide'; clear = true; key = 'pr:' + g.pr.kind;
    } else if (A.sheet) { html = sheetBody(A.sheet); key = 's:' + A.sheet.t + ':' + (A.sheet.lib ? 'lib' : (A.sheet.uid || A.sheet.id || '')); }
    if (!html) return;
    const el = document.createElement('div');
    el.id = 'veil';
    el.dataset.key = key;
    const same = key && key === oldKey;   // the same panel redrawn (a timer, a network update): don't replay its slide-in
    el.className = 'veil' + (clear ? ' clear' : '') + (same ? ' still' : '');
    el.innerHTML = '<div class="' + cls + '">' + html + '</div>';
    if (!clear) el.addEventListener('click', e => { if (e.target === el) { A.sheet = null; render(); } });
    document.body.appendChild(el);
    if (same) el.firstChild.scrollTop = oldTop;
    const cl = el.querySelector('.chatlog');
    if (cl) cl.scrollTop = 1e6;
    const lg = el.querySelector('.log');
    if (lg && !same) { el.querySelector('.sheet').scrollTop = A.logBack != null ? A.logBack : 1e6; A.logBack = null; }
  }

  function promptSheet() {
    const g = A.g, pr = g.pr, v = V();
    let ctx = '', grid = false;
    const k = pr.kind;
    if (k === 'rezice') ctx = bigCard(g.iCard(pr.data[0]), '', true);
    if (k === 'brk' || k === 'brksub') {
      const ice = g.iCard(g.runEnc);
      const subs = GR.fxList(db, ice, 'SUB');
      ctx = bigCard(ice, '', true) + '<div class="subs">' + subs.map((s, i) => '<div class="' + (g.runBroken[i] ? 'b' : '') + '">' + (i + 1) + ') ' + esc(subText(s)) + '</div>').join('') +
        '<div style="color:var(--dim);margin-top:4px">You have ' + v.rCred + '¢</div></div>';
    }
    if (k === 'trashacc') ctx = bigCard(g.refCard(pr.data[0]), '', true);
    if (k === 'trace1' || k === 'trace2') {
      grid = true;
      ctx = k === 'trace1'
        ? '<div class="subs">Trace ' + g.trBase + '. The Runner\'s link is ' + v.rLink + ' and they hold ' + v.rCred + '¢ to boost it. Ties go to the Runner.<br>Effect: ' + esc(g.trSucc || '—') + '</div>'
        : '<div class="subs">Trace strength <b>' + g.trCorp + '</b>. Your link is <b>' + v.rLink + '</b>. To beat it you need link ' + g.trCorp + ' (ties go to you) — spend <b>' + Math.max(0, g.trCorp - v.rLink) + '</b>.<br>If it succeeds: ' + esc(g.trSucc || '—') + '</div>';
    }
    if (k === 'mull') ctx = '<div class="hand" style="padding:0 0 10px">' + v.hand.map(id => tile(id, { k: 'peek:' + id })).join('') + '</div><div class="tapcue">Tap a card to read what it does.</div>';
    let opts;
    if (k === 'disc') {
      opts = '<div class="hand" style="padding:0 0 4px;flex-wrap:wrap">' + pr.data.map((id, i) => tile(id, { k: 'opt:' + i })).join('') + '</div><div style="color:var(--dim);font-size:12px">Tap a card to discard it.</div>';
    } else {
      opts = '<div class="opts' + (grid ? ' grid' : '') + '">' + pr.opts.map((o, i) => {
        let c = '';
        if (i === 0 && (k === 'rezice' || k === 'jack' || k === 'mull')) c = 'pri';
        if (k === 'brk' && pr.data[i][0] === 'D') c = 'warn';
        if (k === 'jack' && i === 1) c = '';
        return '<button class="' + c + '" data-k="opt:' + i + '">' + esc(optLabel(k, o)) + '</button>';
      }).join('') + '</div>';
    }
    return '<div class="kicker"><span>DECIDE</span><button data-k="hide">HIDE ▾</button></div>' + ctx + '<div class="ptext">' + esc(promptText(pr)) + '</div>' + opts;
  }
  function promptText(pr) {
    if (pr.kind === 'brk') { const v = V(); return 'Break subroutines, boost a breaker, or let the unbroken ones fire.'; }
    if (pr.kind === 'trace2' || pr.kind === 'trace1') return 'Spend how many credits?';
    return pr.text;
  }
  function optLabel(k, o) {
    if (k === 'brksub' && o.indexOf('Sub ') === 0) { const m = o.match(/^Sub (\d+): (.*)$/); return m ? 'Sub ' + m[1] + ': ' + subText(m[2]) : o; }
    return o;
  }
  // effect code -> words ("loseclick 1" -> "Runner loses 1 click")
  // a click ability in words, from the point of view of the card's owner (side 0 Corp, 1 Runner)
  function abilityText(code, side, x) {
    const pl = (n, w) => n + ' ' + w + (+n === 1 ? '' : 's'), other = side ? 'The Corp' : 'The Runner';
    const t = code.split('+').map(p => {
      const w = p.trim().split(/\s+/), n = +w[1] || 0;
      switch (w[0]) {
        case 'gain': return 'Gain ' + pl(n, 'credit');
        case 'lose': return 'Lose ' + pl(n, 'credit');
        case 'draw': return 'Draw ' + pl(n, 'card');
        case 'olose': return other + ' loses ' + pl(n, 'credit');
        case 'take': return 'Take ' + pl(n, 'credit') + ' from this card' + (x && x.host != null ? ' (' + x.host + ' left)' : '');
        case 'untag': return 'Remove ' + pl(n, 'tag');
        case 'tag': return 'Give the Runner ' + pl(n, 'tag');
        case 'click': return 'Gain ' + pl(n, 'click');
        case 'trace': return 'Trace ' + w[1] + ': if successful, ' + subText(w.slice(2).join(' ').split('&').join('+')).toLowerCase();
      }
      return subText(p);
    });
    return t.map((p, i) => i ? p.charAt(0).toLowerCase() + p.slice(1) : p).join(', then ');
  }
  function subText(s) {
    const map = {
      etr: () => 'End the run', net: n => 'Do ' + n + ' net damage', meat: n => 'Do ' + n + ' meat damage', brain: n => 'Do ' + n + ' brain damage',
      tag: n => 'Give the Runner ' + n + ' tag' + (n == 1 ? '' : 's'), loseclick: n => 'Runner loses ' + n + ' click' + (n == 1 ? '' : 's'),
      olose: n => 'Runner loses ' + n + ' credit' + (n == 1 ? '' : 's'), gain: n => 'Corp gains ' + n + ' credit' + (n == 1 ? '' : 's'),
      trashprog: () => 'Trash a program', draw: n => 'Corp draws ' + n, lose: n => 'Corp loses ' + n + ' credits',
    };
    return s.split('+').map(p => {
      const w = p.trim().split(/\s+/);
      if (w[0] === 'trace') return 'Trace ' + w[1] + ': ' + subText(w.slice(2).join(' ').split('&').join('+'));
      return map[w[0]] ? map[w[0]](w[1]) : p.trim();
    }).join(', ');
  }

  function overSheet() {
    const g = A.g, won = g.winner === A.me;
    return '<div class="end"><h1 style="color:' + (won ? 'var(--gold)' : 'var(--red)') + '">' + (won ? 'YOU WIN' : 'YOU LOSE') + '</h1><p>' + esc(g.why.charAt(0).toUpperCase() + g.why.slice(1)) + ' · turn ' + g.turn + '</p>' +
      (A.award ? '<div class="award">+' + A.award + ' Chips <small>· ' + wp() + ' to spend</small></div>' : '') + raidOverHtml() + jobsOver() +
      (A.offRaid ? '<button class="big" style="width:100%" data-k="ordone" ' + (A.raidRes && A.raidRes.pending ? 'disabled' : '') + '>DONE</button>'
      : A.net && A.net.raid ? (A.loot ? '' : '<button class="big" style="width:100%" data-k="net:home">DONE</button>') : A.net ? (A.net.host ? '<div class="row2"><button class="big" data-k="net:rematch">REMATCH</button><button class="ghost" data-k="net:leave">LEAVE</button></div>'
        : '<div class="ptext" style="text-align:center;color:var(--dim)">The host can start a rematch.</div><button class="ghost" style="width:100%" data-k="net:leave">LEAVE</button>')
      : '<div class="row2"><button class="big" data-k="again">PLAY AGAIN</button><button class="ghost" data-k="shop">SHOP</button></div>' +
      '<button class="ghost" style="width:100%;margin-top:8px" data-k="home">HOME</button>') +
      (A.net && A.net.peerUid && socOn() && !isFriend(A.net.peerUid) && A.net.peerUid !== A.soc.uid ? (pending()[A.net.peerUid] ? '<div class="onote" style="margin-top:8px">Friend request sent to ' + esc(A.net.peerName) + '</div>' : '<button class="ghost" style="width:100%;margin-top:8px" data-k="fadd2">+ ADD ' + esc((A.net.peerName || 'them').toUpperCase()) + ' AS A FRIEND</button>') : '') +
      (A.net ? '<button class="ghost" style="width:100%;margin-top:8px" data-k="chat">💬 CHAT' + (A.net.unread ? ' (' + A.net.unread + ' new)' : '') + '</button>' : '') +
      '<button class="ghost" style="width:100%;margin-top:8px" data-k="log">SEE THE GAME LOG</button></div>';
  }

  function sheetBody(s) {
    const g = A.g;
    if (s.t === 'raidin') return raidInSheet();
    if (s.t === 'netwait') return netWaitSheet();
    if (s.t === 'dm') return dmSheet(s);
    if (s.t === 'soc') return socSheet(s);
    if (s.t === 'mem') return memSheet(s);
    if (s.t === 'report') return reportSheet(s);
    if (s.t === 'trade') return tradeSheet(s);
    if (s.t === 'invite') return inviteSheet();
    if (s.t === 'raided') return raidedSheet(s);
    if (s.t === 'rules') return '<div class="kicker"><span>HOW TO PLAY</span><button data-k="close">CLOSE ✕</button></div><div class="rules">' + esc(D.rules) + '</div>';
    if (s.t === 'log') return '<div class="kicker"><span>GAME LOG</span><button data-k="close">CLOSE ✕</button></div><div class="log">' +
      g.log.map(l => '<div class="' + (l.indexOf('---') === 0 || l.indexOf('***') === 0 ? 't' : '') + '">' + logText(l) + '</div>').join('') + '</div>' +
      '<div class="ptext" style="color:var(--dim);margin-top:6px">Tap a card name to read the card.</div>';
    if (s.t === 'look') return lookSheet();
    if (s.t === 'train') return trainSheet();
    if (s.t === 'share') return shareSheet();
    if (s.t === 'news') return newsSheet();
    if (s.t === 'chat') return A.net ? chatSheet() : '';
    if (s.t === 'block') return A.net ? blockSheet() : '';
    if (s.t === 'blocked') return blockedListSheet();
    if (s.t === 'netlost') return '<div class="kicker"><span>' + (s.online ? 'ONLINE GAME' : 'NEARBY GAME') + '</span></div><div class="ptext">' + esc(s.text) + (s.game ? ' The game has ended.' : '') + '</div><button class="big" style="width:100%" data-k="net:home">OK</button>';
    if (s.t === 'lcard') return libCardSheet(s.id);
    if (s.t === 'ident2') return identSheet();
    if (s.t === 'pack') return packSheet(s);
    if (s.t === 'setv') return setSheet(s);
    if (s.t === 'menu') {
      return '<div class="kicker"><span>MENU</span><button data-k="close">CLOSE ✕</button></div><div class="opts">' +
        '<button data-k="log">Game log</button><button data-k="rules">How to play</button>' +
        '<button data-k="look">Settings</button>' +
        (A.net ? '' : '<button data-k="speed">CPU speed: ' + SPEED_NAMES[A.speed] + '</button>') +
        (A.autoCpu ? '<button class="pri" data-k="takeover">Take over from the CPU</button>' : '') +
        (A.net ? '' : '<button data-k="fixes">Manual fixes</button>') +
        (A.net ? '<button data-k="net:leave">Leave the game</button><button class="warn" data-k="blockask">Block ' + esc(oppName()) + '</button>' : A.offRaid ? '<button data-k="home">Give up the slice</button>' : '<button data-k="home">Save and go home</button>') +
        (g.phase === 9 ? '' : '<button class="warn" data-k="resign">Concede this game</button>') + '</div>';
    }
    if (s.t === 'fixes') {
      const me = A.me;
      const f = (lab, k) => '<button data-k="' + k + '">' + lab + '</button>';
      return '<div class="kicker"><span>MANUAL FIXES</span><button data-k="close">CLOSE ✕</button></div><div class="ptext" style="color:var(--dim)">For when something unusual happens. Every fix shows in the log.</div><div class="opts">' +
        f('Credits +1', 'fix:adj:cred:1') + f('Credits −1', 'fix:adj:cred:-1') + f('Clicks +1', 'fix:adj:click:1') + f('Clicks −1', 'fix:adj:click:-1') +
        (me ? '' : f('Runner tags +1', 'fix:adj:tag:1') + f('Runner tags −1', 'fix:adj:tag:-1')) +

      return '<div class="kicker"><span>SCORE AREAS</span><button data-k="close">CLOSE ✕</button></div><div class="subs"><b style="color:var(--corp)">Corp scored (' + v.cPts + ')</b>' + l(v.cScore) +
        '<br><b style="color:var(--runner)">Runner stole (' + v.rPts + ')</b>' + l(v.rScore) + '</div>';

        v.cArch.map(id => tile(id, { k: 'peek:' + id })).join('') + '</div>' + (v.cDownN ? '<div class="ptext" style="color:var(--dim)">+ ' + v.cDownN + ' face-down card(s)</div>' : '');
    }

      }).join('') + '</div>';

  }

  function act(label, key, enabled, sub, cls) {
    return '<button class="' + (cls || 'pri') + '" data-k="' + esc(key) + '" ' + (enabled ? '' : 'disabled') + '>' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</button>';
  }

  function handSheet(s) {
    const v = V(), id = v.hand[s.i], c = db[id];
    if (!c) return '';
    const ca = canAct();
    let opts = '';
    const need = handNeed(v, id);
    if (A.me === 0) {
      const servers = (list) => list.map(loc => {
        const tax = c.type === 'ICE' ? iceOn(v, loc).length : 0;
        let sub = c.type === 'ICE' ? (tax ? 'ice tax ' + tax + '¢' : 'free') : '';
        if ((c.type === 'AGENDA' || c.type === 'ASSET') && loc[0] === 'S') { const r = rootOn(v, loc).find(x => db[x.card] && (db[x.card].type === 'AGENDA' || db[x.card].type === 'ASSET')); if (r) sub = 'replaces ' + db[r.card].name + ' (trashed)'; }
        return act('Install in ' + GR.sname(loc), 'install:' + s.i + ':' + loc, ca && tax <= v.cCred, sub, (sub.indexOf('replaces') === 0 ? 'warn' : 'pri'));
      }).join('');
      if (c.type === 'OPERATION') opts = act('Play (' + c.cost + '¢, 1 click)', 'play:' + s.i, ca && !need, need);
      else if (c.type === 'ICE') opts = servers(['HQ', 'RD', 'AR'].concat(v.remotes)) + act('Install in a new remote server', 'install:' + s.i + ':NEW', ca, 'free');
      else if (c.type === 'AGENDA' || c.type === 'ASSET') opts = act('Install in a new remote server', 'install:' + s.i + ':NEW', ca, 'face down') + servers(v.remotes);
      else if (c.type === 'UPGRADE') opts = act('Install in a new remote server', 'install:' + s.i + ':NEW', ca, 'face down') + servers(['HQ', 'RD', 'AR'].concat(v.remotes));
    } else {
      if (c.type === 'EVENT') opts = act('Play (' + c.cost + '¢, 1 click)', 'play:' + s.i, ca && !need, need);
      else if (c.type !== 'IDENTITY') opts = act('Install (' + c.cost + '¢, 1 click)', 'install:' + s.i, ca && !need, need || (c.type === 'PROGRAM' ? 'uses ' + c.mu + ' MU · ' + (v.rMUmax - v.rMU) + ' free' : ''));
    }
    if (!ca) opts += '<div class="ptext" style="color:var(--dim);margin-top:8px">' + (A.g.active === A.me ? (A.g.clicks ? 'Finish what\'s happening first.' : 'No clicks left — end your turn.') : 'Wait for your turn.') + '</div>';
    return bigCard(id) + '<div class="opts">' + opts + '<button class="ghost" data-k="close">Cancel</button></div>';
  }

  function instSheet(s) {
    const v = V(), g = A.g, x = v.inst.find(y => y.iid === s.iid);
    if (!x) return '';
    const id = x.card, c = db[id], mine = id !== '?' && (c.side === 'R') === (A.me === 1);
    let extra = '';
    if (x.adv) extra += '<div class="st" style="color:var(--gold)">Advancement tokens: ' + x.adv + '</div>';
    if (x.host) extra += '<div class="st" style="color:var(--green)">Credits on it: ' + x.host + '</div>';
    if (A.me === 0 && c && !x.rez && c.side === 'C') extra += '<div class="st">Not rezzed yet — the Runner sees it face down.</div>';
    let opts = '';
    const ca = canAct(), fw = freeWindow();
    if (mine && A.me === 0) {
      const t = c.type;
      if (!x.rez && (t === 'ASSET' || t === 'UPGRADE')) opts += act('Rez (' + c.cost + '¢)', 'rez:' + x.iid, fw && v.cCred >= c.cost, 'no click needed');
      if (t === 'ICE' && !x.rez) opts += '<div class="ptext" style="color:var(--dim)">Ice is rezzed when the Runner approaches it — you\'ll be asked then.</div>';
      if (t === 'AGENDA' && x.adv >= c.adv) opts += act('Score it! (' + c.pts + ' pts)', 'score:' + x.iid, myTurnFree(), 'free', 'pri');
      // finish it this turn: enough clicks and credits for the advances still needed, then score (scoring is free)
      const need = t === 'AGENDA' ? c.adv - x.adv : 0;
      if (need > 0 && ca && g.clicks >= need && v.cCred >= need)
        opts += act('Advance ' + (need > 1 ? '×' + need + ' ' : '') + '& score (' + need + '¢, ' + need + ' click' + (need > 1 ? 's' : '') + ')', 'advsc:' + x.iid + ':' + need, true, 'scores ' + c.pts + ' pt' + (c.pts > 1 ? 's' : '') + ' this turn', 'pri');
      // an agenda that's already ready: advancing more does nothing, so ask first
      if (t === 'AGENDA' || g.hasFlag(id, 'adv')) opts += act('Advance (1¢, 1 click)', (t === 'AGENDA' && need <= 0 ? 'advask:' : 'adv:') + x.iid, ca && v.cCred >= 1, t === 'AGENDA' ? x.adv + ' of ' + c.adv + ' tokens' + (need <= 0 ? ' · already enough' : '') : '');

  // ------------------------------------------------------------ feedback

  // ------------------------------------------------------------ flow
  // re-drawing replaces the page, so typed text (room code, name, chat) and the cursor are carried over
  const KEEP = ['.roomcode', '.netname', '.chatin', '.dmin', '.fcode', '.pubin', '.repnote', '.anntext', '.admadd'];
  function render() {
    if (A.raidIn && (!A.sheet || A.sheet.t !== 'raidin')) A.sheet = { t: 'raidin' };
    else if (A.net && A.net.status === 'reconnecting' && A.screen === 'game' && (!A.sheet || A.sheet.t !== 'netwait')) A.sheet = { t: 'netwait' };   // a raid alert stays up until answered
    const act = document.activeElement, saved = {};
    let focus = null, ss = 0, se = 0;
    for (const q of KEEP) { const e = document.querySelector(q); if (e) { saved[q] = e.value; if (e === act) { focus = q; ss = e.selectionStart; se = e.selectionEnd; } } }
    const f = { title: renderTitle, home: renderHome, lib: renderLib, decks: renderDecks, edit: renderEdit, shop: renderShop, lobby: renderLobby, jobs: renderJobs, trade: renderTrade, admin: renderAdmin }[A.screen];
    if (f) f(); else renderGame();
    // the look settings rewrite the page's classes: put back the ones that don't belong to them
    document.body.classList.toggle('calm', A.set.anim === 0);
    document.body.classList.toggle('saver', !!A.saving);
    if (awakeWanted() !== A.awakeOn) keepAwake();
    document.body.classList.toggle('wide', !!A.wide);
    document.body.classList.toggle('tall', !!A.tall);
    if (A.screen === 'game') {   // the turn banner flares when it changes (your turn, a run, decide, game over)
      const bn = $app.querySelector('.banner');

      A.bannerKey = k;
    } else A.bannerKey = undefined;
    if (A.shown !== A.screen) {   // a new screen scans in
      const first = A.shown === undefined;
      A.shown = A.screen;
      if (!first && !calm()) {
        $app.classList.remove('swap'); void $app.offsetWidth; $app.classList.add('swap');
        clearTimeout(A.swapT); A.swapT = setTimeout(() => $app.classList.remove('swap'), 600);
      }
    }
    for (const q in saved) { const e = document.querySelector(q); if (e && !e.dataset.fresh) e.value = saved[q]; }

    lobbyPublish(false);

    histSync();
  }

  // ---- a successful run that found nothing to steal or trash: a 2-second "nothing found" popup for the Runner
  function runWatch(lines, fresh) {
    if (fresh) { A.runW = null; return; }   // a new or reloaded game: don't replay old runs
    for (const l of lines) {
      if (/^The run on .+ is successful\.$/.test(l)) A.runW = { found: false, trash: {}, poor: '' };
      else if (!A.runW) continue;
      else if (l.indexOf('Runner steals ') === 0) A.runW.found = true;
      else {
        let m = /^Runner accesses (.+) in (.+)\.$/.exec(l);
        if (m) { const id = NAME_ID[m[1]], c = id && db[id]; if (c && c.trash > 0 && m[2] !== 'Archives' && (c.type === 'ASSET' || c.type === 'UPGRADE')) A.runW.trash[m[1]] = 1; continue; }
        m = /^Runner cannot afford to trash (.+)\.$/.exec(l);
        if (m) { delete A.runW.trash[m[1]]; A.runW.poor = m[1]; continue; }
        m = /^The run on (.+) is over\.$/.exec(l);
        if (m) { const W = A.runW; A.runW = null; if (!W.found && !Object.keys(W.trash).length && A.me === 1) noFind(m[1], W.poor); }
        else if (/^The run on .+ ends unsuccessfully\.$/.test(l)) A.runW = null;
      }
    }
  }
  function noFind(where, poor) {
    const old = document.querySelector('.nofind');
    if (old) old.remove();
    const e = document.createElement('div');
    e.className = 'nofind';
    const pc = poor && db[NAME_ID[poor]];
    e.innerHTML = pc ? '<b>NOT ENOUGH CREDITS</b><small>Not enough credits to trash ' + (pc.type === 'UPGRADE' ? 'upgrade' : 'asset') + '<br><i>' + esc(poor) + '</i></small>'
      : '<b>NOTHING FOUND</b><small>Nothing to steal or trash in ' + esc(where) + '.</small>';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 2000);
  }
  function afterChange() {
    const g = A.g;
    const prev = A.prev && A.prev.g === g ? A.prev.s : { phase: 0, enc: 0, run: 0, tags: 0, active: -1, clicks: 0, hand: 0, pid: 0, log: 0 };
    soundsFor(prev, g.log.slice(prev.log));
    runWatch(g.log.slice(prev.log), prev.log === 0);
    A.prev = { g, s: snap() };
    if (A.net && A.net.host && A.net.status === 'playing') { if (A.netSkip) A.netSkip = false; else netSend({ t: 'state', state: redact(g.save(), 1 - A.me) }); }
    if (A.tut) {
      A.tut.check();
      if (A.tut.finished) { const d = trainDone(); if (!d[A.tut.L.id]) { d[A.tut.L.id] = 1; store.set('tut', d); addWP(M.AWARD.lesson); setTimeout(() => toast('Lesson complete: +' + M.AWARD.lesson + ' Chips'), 400); } }
    } else if (g.phase === 9) {
      if (!A.recorded) {
        A.recorded = true;
        const w = store.get('wins', { p: 0, w: 0, h: 0 });
        w.p++; if (g.winner === A.me) { w.w++; if (A.level) w.h++; }
        const conceded = g.winner !== A.me && /conceded/.test(g.why);
        A.award = g.winner === A.me ? (A.net ? M.AWARD.pvp : A.level ? M.AWARD.hard : M.AWARD.easy) : conceded ? 0 : M.AWARD.loss;
        if (A.net && A.net.raid) { A.award = 0; raidResult(g); }
        else if (A.offRaid) { A.award = 0; offRaidResult(g); }   // raids pay in cards and their own win points
        addWP(A.award);
        store.set('wins', w);
        jobsRecord(g);
        if (!A.net) store.set('save', null);
      }
    } else {
      A.recorded = false; A.jobMoves = null;
      if (!A.net && !A.offRaid) store.set('save', { me: A.me, level: A.level, game: g.save() });
    }
    render();
    music();
    layers();
    schedule();
  }

  function schedule() {
    clearTimeout(A.tick);
    // the CPU defending a raid for a Wanted player who didn't answer
    if (A.net && A.autoCpu && A.g && A.screen === 'game' && A.autoCpu.wants()) {
      A.tick = setTimeout(() => { if (!A.autoCpu || !A.g) return; A.autoCpu.step(); afterChange(); }, SPEEDS[A.speed]);
      return;
    }
    if (A.net || !A.cpu || !A.g || A.screen !== 'game' || !(A.tut ? A.tut.oppMayMove() : A.cpu.wants())) return;
    const prompt = A.g.wait === A.cpu.SEAT + 1;
    if (A.tut) { A.tick = setTimeout(() => { if (!A.tut || A.screen !== 'game') return; A.cpu.step(); afterChange(); }, prompt ? 900 : 1300); return; }
    A.tick = setTimeout(() => {
      if (!A.g || A.screen !== 'game') return;
      A.cpu.step();
      afterChange();
    }, SPEEDS[A.speed]);
  }

  function doAct(v, a2, a3) {
    A.sheet = null;
    if (A.net && !A.net.host) { netSend({ t: 'act', v, a2: a2 === undefined ? '' : String(a2), a3: a3 === undefined ? '' : String(a3) }); render(); return; }
    A.g.act(A.me, v, a2, a3); afterChange();
  }

  function onKey(k) {

    switch (p[0]) {

      case 'share': return shareGame();

        catch (e) { if (ta) { ta.select(); try { document.execCommand('copy'); done(); } catch (e2) { } } }

      case 'chatq': sendChat(QUICK[+p[1]]); return;

      case 'block': return blockPeer(p[1] === 'leave');
      case 'blocked': A.sheet = { t: 'blocked' }; return render();
      case 'unblock': { const b = blocks(); const n = b[p[1]] ? b[p[1]].n : ''; delete b[p[1]]; store.set('blocks', b); if (n) toast('Unblocked ' + n); if (A.screen === 'lobby' && !A.net) scanGames(); return render(); }
      case 'on': {
        if (p[1] === 'host') return startOnline(true, GR.Online.newCode());
        if (p[1] === 'pub') { store.set('netpub', !store.get('netpub', true)); return render(); }
        if (p[1] === 'ip') { store.set('ipall', !hideAll()); return render(); }
        if (p[1] === 'scan') { scanGames(); return render(); }
        if (p[1] === 'pick') { if (A.games.h) A.games.h.stop(); A.games.scanning = false; return startOnline(false, p[2], true); }
        const inp = document.querySelector('.roomcode');
        const code = ((inp && inp.value) || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (code.length !== 5) { toast('Type the 5-letter room code'); return; }

          return render();
        }
        if (p[1] === 'stop') { netStop(); A.lobbyErr = ''; if (A.screen === 'lobby') scanGames(); return render(); }
        if (p[1] === 'rematch') { if (A.net && A.net.host) startNetGame(); return; }
        if (p[1] === 'leave') { A.sheet = { t: 'confirm', text: 'Leave the game with ' + oppName() + '?' + (A.g && A.g.phase !== 9 ? ' It counts as a loss.' : ''), yes: 'net:leave2' }; return render(); }
        if (p[1] === 'leave2') {
          if (A.net && A.net.raid && A.g && A.g.phase !== 9 && A.net.status === 'playing') {   // leaving a raid loses it
            A.g.gameOver(A.net.raid.role === 'def' ? 1 : 0, A.net.raid.role === 'def' ? 'the defender left the slice' : 'the slicer gave up');
            afterChange(); lootAuto(); const ow = owedLeave();

            netStop(ow); A.autoCpu = null; A.sheet = null; A.screen = 'home'; music(); layers(); return render();
          }

          try { netSend({ t: 'bye', why: netName() + ' left the game.' }); } catch (e) { }
          netStop(); A.sheet = null; A.screen = 'home'; music(); layers(); return render();
        }
        if (p[1] === 'home') { lootAuto(); netStop(owedLeave() || !!store.get('lootOut', []).length); A.autoCpu = null; A.sheet = null; A.screen = 'home'; music(); layers(); return render(); }
        return;
      }
      case 'netc': if (A.net) { A.net.status = 'connecting'; try { GRNative.netConnect(p.slice(1).join(':'), netName()); } catch (e) { } } return render();
      case 'lib': clearTimeout(A.tick); A.screen = 'lib'; A.sheet = null; layers(); return render();

      case 'lnav': libNav(+p[1]); return;

  function fit() {

    const wide = W >= 900 && H >= 560 && W > H * 1.15;
    const tall = !wide && W >= 680;
    const z = wide ? Math.max(1, Math.min(W / 1000, H / 680, 2)) : tall ? Math.max(1, Math.min(W / 560, H / 760, 1.8)) : 1;

    document.body.classList.toggle('wide', wide);
    document.body.classList.toggle('tall', tall);
    document.documentElement.style.setProperty('--z', A.z);
    return was !== A.wide + '|' + A.tall + '|' + A.z;
  }
  fit();
  window.addEventListener('resize', () => { clearTimeout(A.fitT); A.fitT = setTimeout(() => { if (fit() && A.screen === 'game') render(); }, 120); });

  applyRotation();
  // a raid you were defending when Ghostjack closed counts as lost
  (function () {
    const o = store.get('raidOpen', null);
    if (!o || !o.them) return;
    store.set('raidOpen', null);
    const st = raidSt(), c = coll();
    const r = RD.defenderLoses(st, c, { now: Date.now(), me: { n: netName(), i: myId() }, them: { n: nm(o.them.n, 20), i: pid(o.them.i) } });
    raidSave(st); store.set('coll', c);
    setTimeout(() => toast('You left a slice unfinished: you\'ve been Sliced by ' + nm(o.them.n, 20) + (r.lost && db[r.lost] ? ' and lost your hot ' + db[r.lost].name : '')), 1500);
  })();
  // a slicer beat us but Ghostjack closed before their pick arrived: a random card goes
  (function () {
    // a slicer who closed Ghostjack mid-pick: a random card from the list, sent through the failsafe
    const P = store.get('lootPick', null);
    if (P && Array.isArray(P.can) && P.info) { A.loot = { can: P.can.filter(id => db[id]), info: P.info, to: str(P.to, 40) }; lootAuto(); A.raidRes = null; }
    const O = store.get('lootOwed', null);
    if (O && !O.from) { const r = owedAuto(true); if (r && r.lost && db[r.lost]) setTimeout(() => toast(nm(O.them && O.them.n, 20) + ' stole your ' + db[r.lost].name), 1700); }
  })();
  setTimeout(lootPump, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lootPump(); });
  setTimeout(() => checkUpdate(true), 1500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); });
  // the Wanted board: catch up on open, when coming back, and every 2 minutes
  setTimeout(boardSync, 2500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) boardSync(); });
  setInterval(() => { if (!document.hidden) boardSync(); }, 120000);
  // friends, messages and invites: every 20 seconds (browsers slow this down in the background; the app keeps going)
  setTimeout(() => socTick(true), 3000);
  setInterval(() => {
    const gap = (A.screen === 'lobby' || (A.sheet && (A.sheet.t === 'soc' || A.sheet.t === 'mem'))) && !document.hidden ? 0 : (A.saving || document.hidden ? 58e3 : 38e3);
    if (Date.now() - (A.socAuto || 0) < gap) return;
    A.socAuto = Date.now(); socTick(false);
  }, 20000);
  // the listing heartbeat (open game / slice target) keeps its own 40 s beat, so the listing stays fresh in the background too
  setInterval(() => { if (A.lobbyKey) lobbyPublish(true); }, 40000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) socTick(true); });
  // leaving Ghostjack: take this phone off the game and slice lists at once (Wanted players then show as offline)
  window.addEventListener('pagehide', () => { if (A.lobbyKey && socOn()) { A.lobbyKey = ''; SO.lobbyDel(true); } });
  A._after = () => afterChange();   // for testing
  A._soc = f => socTick(f);   // for testing
  A._mod = () => { A.mod.checked = false; return modCheck(); };   // for testing
  window.GR_APP = A; // for testing
  render();
})();
</script>
